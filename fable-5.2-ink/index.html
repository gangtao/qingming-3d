/* 布局：整屏就是画卷；题签竖排在右上，卷轴导航压在底边，从右向左展卷 */
:root{--silk:#d9c59a;--silk-hi:#efe2c0;--ink:#2b2018;--ink-soft:#5f4d3a;--seal:#a2301f;--line:rgba(43,32,24,.45);
--f:"LXGW WenKai","Kaiti SC","STKaiti","KaiTi",serif;color-scheme:light}
html,body{height:100%}
body{background:var(--silk);color:var(--ink);font-family:var(--f);overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{position:relative;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.drag{cursor:grabbing}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 55%,rgba(60,40,15,.28) 100%)}
#title{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:row-reverse;gap:8px;align-items:flex-start;pointer-events:none}
#title h1{margin:0;writing-mode:vertical-rl;font-size:clamp(26px,4.2vw,44px);font-weight:700;letter-spacing:.12em;line-height:1;text-shadow:0 0 12px var(--silk-hi)}
#seal{writing-mode:vertical-rl;background:var(--seal);color:var(--silk-hi);font-size:clamp(12px,1.5vw,15px);padding:6px 3px;border-radius:3px;letter-spacing:.1em;margin-top:4px}
#cap{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));max-width:min(58vw,360px);pointer-events:none;background:rgba(239,226,192,.82);border:1px solid var(--line);border-radius:3px;padding:8px 12px}
#cap b{display:block;font-size:clamp(18px,2.4vw,24px)}
#cap span{display:block;font-size:clamp(13px,1.5vw,15px);color:var(--ink-soft);margin-top:4px;line-height:1.5}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;writing-mode:vertical-rl;font-size:14px;line-height:1;padding:6px 4px;background:rgba(239,226,192,.88);border:1px solid var(--line);border-radius:2px;letter-spacing:.12em;white-space:nowrap;will-change:transform,opacity}
.tag::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:14px;background:var(--line)}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;
padding-block:26px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
background:linear-gradient(rgba(217,197,154,0),rgba(217,197,154,.92) 55%);pointer-events:none}
button{font:inherit;color:var(--ink);background:rgba(239,226,192,.9);border:1px solid var(--line);border-radius:3px;padding:7px 12px;font-size:15px;cursor:pointer}
button:hover{background:var(--silk-hi)}
button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:var(--silk-hi)}
