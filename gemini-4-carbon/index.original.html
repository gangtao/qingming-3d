<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>清明上河图 · 北宋张择端（三维长卷）</title>
<style>
  :root {
    --silk-bg: #d6c3a1; --silk-panel: rgba(236, 223, 196, 0.90);
    --ink: #2b2016; --ink-soft: #594532; --border-gold: rgba(110, 82, 50, 0.48); --seal-red: #933528;
    --kai: "LXGW WenKai", "LXGW WenKai Screen", "Kaiti SC", "STKaiti", "KaiTi", "BiauKai", "DFKai-SB", "AR PL UKai CN", "Songti SC", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--silk-bg); font-family: var(--kai); color: var(--ink); touch-action: none; }
  #canvas-wrap { position: fixed; inset: 0; }
  canvas#gl { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas#gl:active { cursor: grabbing; }
  #silk-overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background-image:
      repeating-linear-gradient(0deg, rgba(68,48,24,0.018) 0px, rgba(68,48,24,0.018) 1px, transparent 1px, transparent 3px),
      repeating-linear-gradient(90deg, rgba(68,48,24,0.014) 0px, rgba(68,48,24,0.014) 1px, transparent 1px, transparent 4px),
      radial-gradient(ellipse at center, transparent 58%, rgba(65,45,22,0.16) 100%);
  }
  #section-card {
    position: fixed; top: 16px; left: 18px; z-index: 10; max-width: min(395px, calc(100vw - 96px));
    padding: 11px 15px; background: var(--silk-panel); border: 1px solid var(--border-gold);
    border-left: 4px solid var(--seal-red); border-radius: 3px; box-shadow: 0 4px 16px rgba(45,32,16,0.15);
    backdrop-filter: blur(5px); pointer-events: none;
  }
  #section-title { font-size: 20px; font-weight: bold; letter-spacing: 2px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  #section-sub { font-size: 12px; color: var(--seal-red); border: 1px solid rgba(147,53,40,0.45); padding: 0 6px; border-radius: 2px; font-weight: normal; }
  #section-desc { font-size: 13.5px; line-height: 1.55; color: var(--ink-soft); }
  #scroll-title {
    position: fixed; top: 16px; right: 18px; z-index: 10; writing-mode: vertical-rl; text-orientation: upright;
    padding: 13px 9px 11px; background: var(--silk-panel); border: 1px solid var(--border-gold); border-radius: 3px;
    box-shadow: 0 4px 16px rgba(45,32,16,0.15); font-size: 23px; letter-spacing: 6px; font-weight: bold;
    pointer-events: none; display: flex; align-items: center; gap: 8px;
  }
  #scroll-seal {
    writing-mode: horizontal-tb; width: 22px; height: 22px; background: var(--seal-red); color: #f4e8d0;
    font-size: 10px; line-height: 10px; display: flex; align-items: center; justify-content: center;
    text-align: center; border-radius: 2px; letter-spacing: 0; box-shadow: inset 0 0 0 1px rgba(244,232,208,0.5);
  }
  #hint-banner {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 10; padding: 6px 18px;
    background: rgba(48,36,23,0.80); color: #f2e5cb; border: 1px solid rgba(218,192,148,0.45);
    border-radius: 20px; font-size: 13px; letter-spacing: 1px; pointer-events: none; white-space: nowrap;
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  #hint-banner.hidden { opacity: 0; transform: translateX(-50%) translateY(-8px); }
  #labels-layer { position: fixed; inset: 0; pointer-events: none; z-index: 6; overflow: hidden; }
  .poi-label {
    position: absolute; transform: translate(-50%, -100%); writing-mode: vertical-rl; text-orientation: upright;
    padding: 6px 4px; background: rgba(242,230,204,0.92); color: #2b1e12; border: 1px solid rgba(110,78,44,0.68);
    border-top: 3px solid var(--seal-red); border-radius: 2px; font-size: 12.5px; letter-spacing: 2px;
    box-shadow: 0 2px 8px rgba(35,24,12,0.22); white-space: nowrap; transition: opacity 0.2s ease;
  }
  .poi-label::after {
    content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%);
    border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid rgba(110,78,44,0.75);
  }
  #view-panel {
    position: fixed; right: 16px; bottom: 74px; z-index: 12; width: 214px; background: var(--silk-panel);
    border: 1px solid var(--border-gold); border-radius: 4px; box-shadow: 0 4px 18px rgba(42,29,14,0.18);
    backdrop-filter: blur(5px); overflow: hidden; transition: width 0.22s ease;
  }
  #view-panel.collapsed { width: 82px; }
  #view-header {
    padding: 7px 12px; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    background: rgba(196,173,134,0.42); border-bottom: 1px solid rgba(110,82,50,0.25); font-size: 14.5px; font-weight: bold; letter-spacing: 2px;
  }
  #view-panel.collapsed #view-header { border-bottom: none; }
  #view-toggle-icon { font-size: 12px; color: var(--ink-soft); transition: transform 0.22s; }
  #view-panel.collapsed #view-toggle-icon { transform: rotate(180deg); }
  #view-body { padding: 10px 12px 11px; display: flex; flex-direction: column; gap: 8px; }
  #view-panel.collapsed #view-body { display: none; }
  .ctrl-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .ctrl-row label { width: 32px; flex-shrink: 0; color: var(--ink-soft); }
  .ctrl-row input[type="range"] { flex: 1; accent-color: var(--seal-red); height: 4px; cursor: pointer; }
  .btn-row { display: flex; gap: 8px; margin-top: 2px; }
  .silk-btn {
    flex: 1; padding: 4px 0; cursor: pointer; font-family: var(--kai); font-size: 13.5px; letter-spacing: 2px;
    background: rgba(220,202,168,0.88); color: var(--ink); border: 1px solid rgba(110,82,50,0.55); border-radius: 3px;
  }
  .silk-btn:hover { background: rgba(202,180,140,0.96); }
  .silk-btn.active { background: var(--seal-red); color: #f7ecd6; border-color: #6f2419; }
  #minimap-bar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 60px; z-index: 15;
    background: #c7b089; border-top: 2px solid #7d613e; box-shadow: 0 -3px 14px rgba(35,24,11,0.22); cursor: pointer; overflow: hidden;
  }
  #minimap-canvas { width: 100%; height: 100%; display: block; }
  .seg-labels { position: absolute; inset: 0; pointer-events: none; display: flex; }
  .seg-item {
    height: 100%; display: flex; align-items: flex-start; justify-content: center; padding-top: 3px;
    font-size: 12px; letter-spacing: 2px; color: rgba(40,26,12,0.88);
    text-shadow: 0 0 4px rgba(238,224,195,0.95), 0 0 8px rgba(238,224,195,0.9); border-right: 1px dashed rgba(88,63,35,0.42);
  }
  .seg-item:last-child { border-right: none; }
  #nav-viewport {
    position: absolute; top: 2px; bottom: 2px; left: 45%; width: 12%; border: 2px solid var(--seal-red);
    background: rgba(248,235,202,0.24); box-shadow: 0 0 0 1px rgba(255,244,218,0.65), inset 0 0 8px rgba(147,53,40,0.2);
    border-radius: 2px; cursor: ew-resize;
  }
  #nav-viewport::before, #nav-viewport::after {
    content: ""; position: absolute; top: 50%; width: 3px; height: 16px; transform: translateY(-50%); background: var(--seal-red); border-radius: 1px;
  }
  #nav-viewport::before { left: 2px; }
  #nav-viewport::after { right: 2px; }
  #loading-mask {
    position: fixed; inset: 0; z-index: 50; background: #d5c19d; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; transition: opacity 0.5s ease;
  }
  #loading-mask.done { opacity: 0; pointer-events: none; }
  #loading-title { font-size: 28px; letter-spacing: 8px; }
  #loading-sub { font-size: 14px; letter-spacing: 2px; color: var(--ink-soft); text-align: center; padding: 0 20px; }
  @media (max-width: 767px) {
    #section-card { top: 10px; left: 10px; padding: 8px 11px; max-width: calc(100vw - 72px); }
    #section-title { font-size: 16px; } #section-desc { font-size: 12px; }
    #scroll-title { top: 10px; right: 10px; font-size: 18px; padding: 10px 6px; letter-spacing: 4px; }
    #hint-banner { top: auto; bottom: 68px; font-size: 11.5px; padding: 5px 12px; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
    #minimap-bar { height: 52px; } #view-panel { bottom: 60px; right: 10px; }
  }
</style>
</head>
<body>

<div id="loading-mask">
  <div id="loading-title">清明上河图</div>
  <div id="loading-sub">正在展卷构筑北宋汴京山水舟车人物……</div>
</div>
<div id="canvas-wrap"><canvas id="gl"></canvas></div>
<div id="silk-overlay"></div>
<div id="labels-layer"></div>

<div id="section-card">
  <div id="section-title"><span id="section-name">汴河虹桥</span><span id="section-sub">卷中</span></div>
  <div id="section-desc">飞虹无柱斜跨汴水，桥面车马争道、摊贩云集；桥下大漕船急降人字桅杆，船工撑篙扳舵，两岸呼声相闻。</div>
</div>

<div id="scroll-title"><span>清明上河图</span><div id="scroll-seal">张择端</div></div>
<div id="hint-banner">左键拖动平移 · 右键或Shift拖动转视角 · 滚轮/双指缩放 · 方向键漫游</div>

<div id="view-panel">
  <div id="view-header" title="展开或收起视角面板"><span>视角</span><span id="view-toggle-icon">▾</span></div>
  <div id="view-body">
    <div class="ctrl-row"><label for="sl-zoom">缩放</label><input id="sl-zoom" type="range" min="0" max="100" value="34" /></div>
    <div class="ctrl-row"><label for="sl-pitch">俯仰</label><input id="sl-pitch" type="range" min="14" max="76" value="36" /></div>
    <div class="ctrl-row"><label for="sl-yaw">旋转</label><input id="sl-yaw" type="range" min="-160" max="160" value="-8" /></div>
    <div class="btn-row">
      <button id="btn-labels" class="silk-btn active" type="button">题签</button>
      <button id="btn-reset" class="silk-btn" type="button">复位</button>
    </div>
  </div>
</div>

<div id="minimap-bar">
  <canvas id="minimap-canvas" width="1560" height="120"></canvas>
  <div class="seg-labels">
    <div class="seg-item" style="width: 35.6%;">城门街市</div>
    <div class="seg-item" style="width: 32.7%;">汴河虹桥</div>
    <div class="seg-item" style="width: 31.7%;">郊野春色</div>
  </div>
  <div id="nav-viewport"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';

if (typeof THREE === 'undefined') {
  document.getElementById('loading-sub').textContent = '未检测到 Three.js (r128)，请联网加载或将 three.min.js 置于同目录引用。';
  return;
}

// === MODULE: 01-parts.js ===
const Q = {};
let _seed = 11201125;
Q.rand = () => { _seed = (_seed * 1664525 + 1013904223) >>> 0; return _seed / 4294967296; };
Q.randRange = (a, b) => a + (b - a) * Q.rand();
Q.pick = (arr) => arr[Math.floor(Q.rand() * arr.length)];
Q.clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
Q.lerp = (a, b, t) => a + (b - a) * t;

Q.PAL = {
  silkSky: 0xd7c4a1, silkFog: 0xd3be98, bamboo: 0x9b865c, willows: 0x747d54,
  crimson: 0x893a2f, celadon: 0x5f705d, soot: 0x312b25, skin: 0xcfa982,
  robes: [0xc4b59b, 0xb5a284, 0x8d785e, 0x73634f, 0x58646d, 0x697360, 0x895d41, 0x6b5848, 0xa99679, 0x7a493d, 0x5d665c, 0x978266]
};

Q.TEX = {};
function makeCanvasTex(w, h, drawFn, rx = 1, ry = 1) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  drawFn(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  return t;
}

Q.initTextures = function () {
  Q.TEX.tile = makeCanvasTex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#575148'; ctx.fillRect(0, 0, w, h);
    const cw = w / 12;
    for (let i = 0; i < 12; i++) {
      const g = ctx.createLinearGradient(i * cw, 0, (i + 1) * cw, 0);
      g.addColorStop(0, '#3e3932'); g.addColorStop(0.38, '#696257'); g.addColorStop(0.7, '#4f4a41'); g.addColorStop(1, '#38332d');
      ctx.fillStyle = g; ctx.fillRect(i * cw, 0, cw, h);
    }
    ctx.strokeStyle = 'rgba(30,26,22,0.42)'; ctx.lineWidth = 1.5;
    for (let y = 0; y < h; y += 18) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  }, 3, 2);

  Q.TEX.thatch = makeCanvasTex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#967e53'; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 1500; i++) {
      const x = (i * 53) % w, y = (i * 97) % h;
      ctx.strokeStyle = i % 3 === 0 ? '#78623d' : (i % 3 === 1 ? '#ad9669' : '#655131');
      ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + ((i % 7) - 3), y + 14); ctx.stroke();
    }
  }, 2, 2);

  Q.TEX.wood = makeCanvasTex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#654a33'; ctx.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 4) {
      ctx.fillStyle = (y % 8 === 0) ? 'rgba(40,26,14,0.16)' : 'rgba(165,132,92,0.08)';
      ctx.fillRect(0, y, w, 2);
    }
    ctx.strokeStyle = 'rgba(34,22,12,0.35)';
    for (let x = 32; x < w; x += 32) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  }, 2, 2);

  Q.TEX.brick = makeCanvasTex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#7e7465'; ctx.fillRect(0, 0, w, h);
    for (let r = 0; r < 16; r++) {
      const off = (r % 2) * 16;
      for (let c = -1; c <= 8; c++) {
        const s = 92 + ((r * 17 + c * 31) & 23);
        ctx.fillStyle = `rgb(${s + 8},${s + 2},${s - 8})`;
        ctx.fillRect(c * 32 + off + 1, r * 16 + 1, 30, 14);
      }
    }
  }, 4, 3);

  Q.TEX.mat = makeCanvasTex(128, 128, (ctx, w, h) => {
    ctx.fillStyle = '#a89062'; ctx.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 8) for (let x = 0; x < w; x += 8) {
      ctx.fillStyle = (((x + y) >> 3) & 1) ? '#b79f70' : '#8f784d';
      ctx.fillRect(x, y, 7, 7);
    }
  }, 3, 2);

  Q.TEX.lattice = makeCanvasTex(128, 128, (ctx, w, h) => {
    ctx.fillStyle = '#d7c7a8'; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#4f3824'; ctx.lineWidth = 4; ctx.strokeRect(2, 2, w - 4, h - 4);
    ctx.lineWidth = 2;
    for (let x = 16; x < w; x += 16) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (let y = 24; y < h; y += 24) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  }, 1, 1);

  Q.TEX.ground = makeCanvasTex(512, 512, (ctx, w, h) => {
    ctx.fillStyle = '#c4af89'; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 4200; i++) {
      ctx.fillStyle = i % 2 === 0 ? 'rgba(92,72,46,0.06)' : 'rgba(232,216,184,0.07)';
      ctx.fillRect((i * 173) % w, (i * 293) % h, 4 + (i % 6), 3 + (i % 5));
    }
  }, 18, 6);

  Q.TEX.water = makeCanvasTex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#757c66'; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 400; i++) {
      const x = (i * 67) % w, y = (i * 113) % h;
      ctx.strokeStyle = i % 2 ? 'rgba(218,210,182,0.16)' : 'rgba(54,60,46,0.16)';
      ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 14, y - 3, x + 28, y); ctx.stroke();
    }
  }, 16, 5);

  Q.TEX.face = makeCanvasTex(128, 128, (ctx, w, h) => {
    ctx.fillStyle = '#cfa982'; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#2d2219'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(42, 48); ctx.quadraticCurveTo(49, 44, 56, 47); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(72, 47); ctx.quadraticCurveTo(79, 44, 86, 48); ctx.stroke();
    ctx.fillStyle = '#231a13';
    ctx.beginPath(); ctx.arc(50, 56, 3.3, 0, 6.28); ctx.arc(78, 56, 3.3, 0, 6.28); ctx.fill();
    ctx.strokeStyle = '#9c7350'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(64, 54); ctx.lineTo(64, 72); ctx.stroke();
    ctx.strokeStyle = '#4e3528'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(56, 83); ctx.quadraticCurveTo(64, 86, 72, 83); ctx.stroke();
  }, 1, 1);
  Q.TEX.face.wrapS = Q.TEX.face.wrapT = THREE.ClampToEdgeWrapping;
};

const _signCache = {};
Q.makeSignTexture = function (text, opts = {}) {
  const key = text + JSON.stringify(opts);
  if (_signCache[key]) return _signCache[key];
  const vert = opts.vertical !== false, chars = Array.from(text);
  const w = vert ? 96 : Math.max(160, chars.length * 64 + 32);
  const h = vert ? Math.max(160, chars.length * 60 + 36) : 96;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = opts.bg || '#e2d1ae'; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = opts.border || '#6a4b2d'; ctx.lineWidth = 6; ctx.strokeRect(4, 4, w - 8, h - 8);
  if (opts.redTop) { ctx.fillStyle = '#8e372b'; ctx.fillRect(4, 4, w - 8, 16); }
  ctx.fillStyle = opts.fg || '#271c12';
  ctx.font = `bold ${opts.fontSize || 44}px "LXGW WenKai", "Kaiti SC", "STKaiti", "KaiTi", serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const step = ((vert ? h : w) - 30) / chars.length;
  chars.forEach((ch, i) => vert ? ctx.fillText(ch, w / 2, 16 + step * (i + 0.5)) : ctx.fillText(ch, 15 + step * (i + 0.5), h / 2 + 2));
  return (_signCache[key] = new THREE.CanvasTexture(cv));
};

Q.StaticBatcher = class {
  constructor() { this.buckets = new Map(); }
  add(geom, matKey, material, matrix, colorHex) {
    let b = this.buckets.get(matKey);
    if (!b) { b = { material, pos: [], norm: [], uv: [], col: [] }; this.buckets.set(matKey, b); }
    const g = geom.index ? geom.toNonIndexed() : geom;
    const pA = g.attributes.position, nA = g.attributes.normal, uA = g.attributes.uv, cA = g.attributes.color;
    const v = new THREE.Vector3(), n = new THREE.Vector3(), nm = new THREE.Matrix3().getNormalMatrix(matrix);
    const bc = new THREE.Color(colorHex !== undefined ? colorHex : 0xffffff);
    for (let i = 0; i < pA.count; i++) {
      v.fromBufferAttribute(pA, i).applyMatrix4(matrix); b.pos.push(v.x, v.y, v.z);
      if (nA) { n.fromBufferAttribute(nA, i).applyMatrix3(nm).normalize(); b.norm.push(n.x, n.y, n.z); } else b.norm.push(0, 1, 0);
      if (uA) b.uv.push(uA.getX(i), uA.getY(i)); else b.uv.push(0, 0);
      if (cA) b.col.push(cA.getX(i) * bc.r, cA.getY(i) * bc.g, cA.getZ(i) * bc.b); else b.col.push(bc.r, bc.g, bc.b);
    }
    if (geom.index) g.dispose();
  }
  build(parent) {
    this.buckets.forEach((b) => {
      if (!b.pos.length) return;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(b.pos, 3));
      geo.setAttribute('normal', new THREE.Float32BufferAttribute(b.norm, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(b.uv, 2));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(b.col, 3));
      b.material.vertexColors = true;
      const mesh = new THREE.Mesh(geo, b.material);
      mesh.castShadow = true; mesh.receiveShadow = true;
      parent.add(mesh);
    });
  }
};

Q.mergeLocalParts = function (parts) {
  const pos = [], norm = [], uv = [], col = [];
  const v = new THREE.Vector3(), n = new THREE.Vector3();
  for (const pt of parts) {
    const g = pt.geom.index ? pt.geom.toNonIndexed() : pt.geom;
    const pA = g.attributes.position, nA = g.attributes.normal, uA = g.attributes.uv;
    const m = pt.matrix || new THREE.Matrix4(), nm = new THREE.Matrix3().getNormalMatrix(m);
    const c = new THREE.Color(pt.color !== undefined ? pt.color : 0xffffff);
    for (let i = 0; i < pA.count; i++) {
      v.fromBufferAttribute(pA, i).applyMatrix4(m); pos.push(v.x, v.y, v.z);
      if (nA) { n.fromBufferAttribute(nA, i).applyMatrix3(nm).normalize(); norm.push(n.x, n.y, n.z); } else norm.push(0, 1, 0);
      if (uA) uv.push(uA.getX(i), uA.getY(i)); else uv.push(0.5, 0.5);
      col.push(c.r, c.g, c.b);
    }
    if (pt.geom.index) g.dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3));
  out.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  out.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  return out;
};

Q.mat4 = function (x, y, z, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
  const m = new THREE.Matrix4();
  m.compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz, 'YXZ')), new THREE.Vector3(sx, sy, sz));
  return m;
};

// === MODULE: 02-world-terrain.js ===
Q.WORLD = {
  minX: -260, maxX: 260, minZ: -52, maxZ: 52, waterY: -0.88,
  rbNE: { x: 23.0, z: -13.0 }, rbSW: { x: 12.0, z: 16.5 }, rbHalfWidth: 4.1,
  moatX: -68.0, moatHalfW: 5.5, moatBridgeZ: 4.0, moatBridgeHalfW: 3.4
};

const RIVER_PTS = [
  [162, 62], [146, 44], [122, 27], [92, 15.5], [58, 9.2],
  [28, 4.0], [17.5, 1.8], [-2, -3.5], [-24, -12.0], [-42, -26.5], [-56, -54], [-65, -72]
];

Q.getRiverInfo = function (x) {
  if (x > 160 || x < -64) return { active: false, z: 999, halfW: 10, slope: 0 };
  let i = 0;
  while (i < RIVER_PTS.length - 2 && x < RIVER_PTS[i + 1][0]) i++;
  const [x0, z0] = RIVER_PTS[i], [x1, z1] = RIVER_PTS[i + 1];
  const t = Q.clamp((x - x0) / (x1 - x0), 0, 1), st = t * t * (3 - 2 * t);
  return { active: true, z: Q.lerp(z0, z1, st), halfW: 12.2 + 1.4 * Math.sin(x * 0.045), slope: (z1 - z0) / (x1 - x0) };
};

Q.getBrookInfo = (x, z) => { const bx = 236 + Math.sin(z * 0.09) * 3.5; return { x: bx, dist: Math.abs(x - bx), halfW: 1.9 }; };

Q.getRainbowBridgeInfo = function (x, z) {
  const ax = Q.WORLD.rbNE.x, az = Q.WORLD.rbNE.z, bx = Q.WORLD.rbSW.x, bz = Q.WORLD.rbSW.z;
  const dx = bx - ax, dz = bz - az, lenSq = dx * dx + dz * dz, len = Math.sqrt(lenSq);
  const u = ((x - ax) * dx + (z - az) * dz) / lenSq;
  const v = ((x - ax) * (-dz) + (z - az) * dx) / len;
  if (u >= -0.08 && u <= 1.08 && Math.abs(v) <= Q.WORLD.rbHalfWidth) {
    return { onBridge: true, u, v, y: 0.22 + 4.35 * Math.sin(Math.PI * Q.clamp(u, 0, 1)) };
  }
  return { onBridge: false, u, v, y: 0 };
};

Q.getTerrainY = function (x, z) {
  let y = 0.06 * Math.sin(x * 0.04) * Math.cos(z * 0.06);
  if (x > 110) {
    const r = Q.clamp((x - 110) / 140, 0, 1);
    y += r * 0.35 + 0.25 * Math.sin(x * 0.07 + z * 0.08) * r;
    if (z < -24) y += Math.abs(z + 24) * 0.055 * r;
  }
  if (x > 224 && x < 248) {
    const bk = Q.getBrookInfo(x, z);
    if (bk.dist < bk.halfW + 1.8) { const k = 1 - bk.dist / (bk.halfW + 1.8); y -= k * k * 1.45; }
  }
  const rv = Q.getRiverInfo(x);
  if (rv.active) {
    const d = Math.abs(z - rv.z);
    if (d < rv.halfW) return -0.95 - 1.75 * Math.cos((d / rv.halfW) * Math.PI * 0.5);
    if (d < rv.halfW + 4.2) y += Math.sin(((d - rv.halfW) / 4.2) * Math.PI) * 0.28;
  }
  const md = Math.abs(x - Q.WORLD.moatX);
  if (md < Q.WORLD.moatHalfW) return -0.95 - 1.35 * Math.cos((md / Q.WORLD.moatHalfW) * Math.PI * 0.5);
  if (md < Q.WORLD.moatHalfW + 3.0) y += 0.16 * Math.sin(((md - Q.WORLD.moatHalfW) / 3.0) * Math.PI);
  return y;
};

Q.getSurfaceY = function (x, z) {
  const rb = Q.getRainbowBridgeInfo(x, z);
  if (rb.onBridge && rb.u >= 0 && rb.u <= 1) return rb.y;
  if (Math.abs(x - Q.WORLD.moatX) <= 7.8 && Math.abs(z - Q.WORLD.moatBridgeZ) <= Q.WORLD.moatBridgeHalfW) {
    return 0.18 + 0.68 * Math.cos((Math.abs(x - Q.WORLD.moatX) / 7.8) * Math.PI * 0.5);
  }
  if (Math.abs(x - 236) <= 3.2 && Math.abs(z + 8) <= 1.8) {
    return 0.36 + 0.28 * Math.cos((Math.abs(x - 236) / 3.2) * Math.PI * 0.5);
  }
  return Math.max(-0.2, Q.getTerrainY(x, z));
};

Q.buildTerrainAndWater = function (scene, batcher) {
  const width = Q.WORLD.maxX - Q.WORLD.minX, depth = Q.WORLD.maxZ - Q.WORLD.minZ;
  const geo = new THREE.PlaneGeometry(width, depth, 260, 68);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), c = new THREE.Color();

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), y = Q.getTerrainY(x, z);
    pos.setY(i, y);
    c.setHex(0xc4ae87);
    if (y < -0.55) c.setHex(0x635b49);
    else {
      const onRoad = (x <= -74 && Math.abs(z - 4.0) < 4.6) || (Math.abs(x + 172) < 4.2) ||
        (x > -74 && x <= 14 && Math.abs(z - (4.0 + (x + 56) * 0.18)) < 4.5) ||
        (x > 20 && Math.abs(z + 10.5 - Math.sin(x * 0.03) * 2.5) < 3.4);
      if (onRoad) c.setHex(x < -88 ? 0xbca783 : 0xcbb68f);
      else if (x > 105) c.lerp(new THREE.Color(0x9a9668), Q.clamp((x - 105) / 120, 0, 1) * (0.35 + 0.25 * Math.sin(x * 0.11 + z * 0.13)));
      else if (x < -88) c.setHex(0xb8a37f);
      const rv = Q.getRiverInfo(x);
      if (rv.active && Math.abs(z - rv.z) < rv.halfW + 2.2) c.lerp(new THREE.Color(0x7c6d52), 0.48);
    }
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const terrainMesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ map: Q.TEX.ground, vertexColors: true }));
  terrainMesh.receiveShadow = true;
  scene.add(terrainMesh);

  for (let x = -52; x <= 142; x += 2.6) {
    const rv = Q.getRiverInfo(x);
    if (!rv.active) continue;
    for (const s of [-1, 1]) {
      const bz = rv.z + s * (rv.halfW - 0.25);
      if (bz > Q.WORLD.minZ + 1 && bz < Q.WORLD.maxZ - 1) {
        batcher.add(Q.GEO.cyl, 'wood', Q.MAT.wood, Q.mat4(x, -0.45, bz, 0, 0, 0, 0.22, 1.35, 0.22), 0x5c442e);
      }
    }
  }
  for (let z = -49; z <= 49; z += 4.0) {
    if (Math.abs(z - Q.WORLD.moatBridgeZ) < 3.6) continue;
    for (const s of [-1, 1]) {
      batcher.add(Q.GEO.box, 'brick', Q.MAT.brick, Q.mat4(Q.WORLD.moatX + s * (Q.WORLD.moatHalfW - 0.15), -0.35, z, 0, 0, 0, 0.45, 1.15, 3.95), 0x847a6b);
    }
  }

  const waterMat = new THREE.MeshPhongMaterial({ map: Q.TEX.water, color: 0x868c74, specular: 0x595243, shininess: 32, transparent: true, opacity: 0.9 });
  const waterGeo = new THREE.PlaneGeometry(width, depth, 120, 32); waterGeo.rotateX(-Math.PI / 2);
  const waterMesh = new THREE.Mesh(waterGeo, waterMat); waterMesh.position.y = Q.WORLD.waterY; waterMesh.receiveShadow = true;
  scene.add(waterMesh);

  const brookGeo = new THREE.PlaneGeometry(8, 102); brookGeo.rotateX(-Math.PI / 2);
  const brookMesh = new THREE.Mesh(brookGeo, waterMat); brookMesh.position.set(236, -0.58, 0);
  scene.add(brookMesh);

  return {
    update(time) {
      Q.TEX.water.offset.x = -time * 0.022;
      Q.TEX.water.offset.y = Math.sin(time * 0.4) * 0.008;
    }
  };
};

  _samplePath(path, t, lateral = 0) {
    const segs = path.length - 1, f = Q.clamp(t, 0, 0.99999) * segs, i = Math.floor(f), u = f - i;

    return { x: x0 + dx * u + (-dz / len) * lateral, z: z0 + dz * u + (dx / len) * lateral, yaw: Math.atan2(dx, dz) };
  }

  update(time, dt) {

      sd.group.rotation.set(Math.sin(time * 5.8) * 0.018, yaw, 0);
      sd.carrierFront.x = p.x + Math.sin(yaw) * 1.45; sd.carrierFront.z = p.z + Math.cos(yaw) * 1.45; sd.carrierFront.yaw = yaw;
      sd.carrierBack.x = p.x - Math.sin(yaw) * 1.45; sd.carrierBack.z = p.z - Math.cos(yaw) * 1.45; sd.carrierBack.yaw = yaw;
    }

    for (const ct of this.carts) {
      ct.pathT += (dt * ct.speed * 0.012) * ct.dir;
      if (ct.pathT > 0.98) { ct.pathT = 0.98; ct.dir = -1; } else if (ct.pathT < 0.02) { ct.pathT = 0.02; ct.dir = 1; }
      const p = this._samplePath(ct.path, ct.pathT, 0), yaw = ct.dir > 0 ? p.yaw : p.yaw + Math.PI;
      ct.group.position.set(p.x, Q.getSurfaceY(p.x, p.z), p.z); ct.group.rotation.y = yaw;

      } else {

    for (let i = 0; i < this.animals.length; i++) {
      const an = this.animals[i];
      if (an.path) {

      if (a.boatRef) {
        const bg = a.boatRef.group, wp = v.set(a.localPos.x, a.localPos.y, a.localPos.z).applyMatrix4(bg.matrixWorld);

          const sp = this._samplePath(a.path, a.pathT, a.lateral);

      if (a.role === 'tracker') {

Q.ArchBuilder = class {
  constructor(scene, batcher) {
    this.scene = scene; this.batcher = batcher;

  _makeCurvedSlopeGeo(width, span, rise) {
    const geo = new THREE.PlaneGeometry(width, span, 2, 6), pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const t = (span * 0.5 - pos.getY(i)) / span;
      pos.setZ(i, -Math.sin(t * Math.PI) * rise * 0.16);
    }
    geo.computeVertexNormals();
    return geo;
  }

  addRoof(cx, baseY, cz, w, d, yaw, opts = {}) {
    const b = this.batcher, isThatch = opts.type === 'thatch', isXieshan = opts.type === 'xieshan';
    const over = opts.overhang || (isThatch ? 0.55 : 0.68), rw = w + over * 2, rd = d + over * 2;
    const rise = opts.rise || rd * (isThatch ? 0.31 : 0.28), halfD = rd * 0.5;
    const slopeLen = Math.hypot(halfD, rise), pitch = Math.atan2(rise, halfD);
    const sinY = Math.sin(yaw), cosY = Math.cos(yaw);
    const toW = (lx, ly, lz) => ({ x: cx + lx * cosY + lz * sinY, y: baseY + ly, z: cz - lx * sinY + lz * cosY });
    const matKey = isThatch ? 'thatch' : 'tile', matObj = isThatch ? Q.MAT.thatch : Q.MAT.tile;
    const roofCol = isThatch ? 0xab9366 : (opts.tileColor || 0xd6cfc2);

    const slopeGeo = this._makeCurvedSlopeGeo(rw, slopeLen, rise);
    for (const side of [-1, 1]) {

      m.multiply(Q.mat4(0, 0, 0, -(Math.PI / 2 - pitch), 0, 0));

    for (const sx of [-1, 1]) {

    if (isThatch) {
      for (const side of [-1, 1]) {
        const ep = toW(0, 0.05, side * (halfD - 0.08));

      }
      const rp = toW(0, rise + 0.04, 0);

      }

  buildRainbowBridge() {
    const b = this.batcher, ax = Q.WORLD.rbNE.x, az = Q.WORLD.rbNE.z, bx = Q.WORLD.rbSW.x, bz = Q.WORLD.rbSW.z;
    const dx = bx - ax, dz = bz - az, len = Math.hypot(dx, dz), ux = dx / len, uz = dz / len, nx = -uz, nz = ux;

  addBoat(cfg, crowd) {

    const hull = new THREE.Mesh(this._buildHullGeo(length, beam, depth), Q.MAT.wood);
    hull.castShadow = true; hull.receiveShadow = true; group.add(hull);
    let scullOar = null, mastGroup = null;

    return boatObj;
  }

    for (const bt of this.boats) {
      const amp = bt.moored ? 0.55 : 1.0;
      bt.group.position.y = bt.baseY + Math.sin(time * 1.85 + bt.phase) * 0.035 * amp;

      if (bt.mastState === 'lowering' && bt.mastGroup) bt.mastGroup.rotation.x = -0.98 + Math.sin(time * 1.7) * 0.06;

    const wz2py = (wz) => ((wz - Q.WORLD.minZ) / (Q.WORLD.maxZ - Q.WORLD.minZ)) * h;

    ctx.fillStyle = 'rgba(104, 112, 90, 0.72)';
    ctx.beginPath();
    for (let x = -60; x <= 156; x += 3) { const rv = Q.getRiverInfo(x); x === -60 ? ctx.moveTo(wx2px(x), wz2py(rv.z - rv.halfW)) : ctx.lineTo(wx2px(x), wz2py(rv.z - rv.halfW)); }
    for (let x = 156; x >= -60; x -= 3) { const rv = Q.getRiverInfo(x); ctx.lineTo(wx2px(x), wz2py(rv.z + rv.halfW)); }
    ctx.closePath(); ctx.fill();
    ctx.fillRect(wx2px(Q.WORLD.moatX - 5), 0, 14, h); ctx.fillRect(wx2px(235), 0, 5, h);

    ctx.strokeStyle = 'rgba(176, 148, 106, 0.7)'; ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(wx2px(-258), wz2py(4)); ctx.lineTo(wx2px(-58), wz2py(4));
    ctx.lineTo(wx2px(12), wz2py(16.5)); ctx.lineTo(wx2px(23), wz2py(-13)); ctx.lineTo(wx2px(255), wz2py(-9));
    ctx.moveTo(wx2px(-172), 0); ctx.lineTo(wx2px(-172), h);
    ctx.stroke();

    const gateX = wx2px(-88);
    ctx.fillStyle = '#5a4e40'; ctx.fillRect(gateX - 5, 0, 10, h);
    ctx.fillStyle = '#3d2f22'; ctx.fillRect(gateX - 9, wz2py(-6), 18, 24);
    ctx.strokeStyle = '#5b3923'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(wx2px(23), wz2py(-13)); ctx.lineTo(wx2px(12), wz2py(16.5)); ctx.stroke();

    ctx.fillStyle = 'rgba(72, 62, 50, 0.78)';
    for (let x = -250; x <= 125; x += 11) {
      if (Math.abs(x + 88) < 9 || Math.abs(x + 68) < 9) continue;
      if (x < 8) { ctx.fillRect(wx2px(x) - 10, wz2py(-10), 19, 10); ctx.fillRect(wx2px(x) - 10, wz2py(11), 19, 10); }
      else { const rv = Q.getRiverInfo(x); ctx.fillRect(wx2px(x) - 9, wz2py(rv.z - rv.halfW - 8), 17, 9); }
    }
    ctx.fillStyle = '#4a3723';
    [-31, -8, 6, 27, 44, 56, 68, 78, 90, 108, 121, 134].forEach((bx) => ctx.fillRect(wx2px(bx) - 12, wz2py(Q.getRiverInfo(bx).z) - 3, 24, 5));

    ctx.fillStyle = 'rgba(90, 96, 65, 0.65)';
    for (let x = -60; x <= 255; x += 7) {
      const cnt = x > 145 ? 4 : 1;
      for (let c = 0; c < cnt; c++) { ctx.beginPath(); ctx.arc(wx2px(x), ((x * 37 + c * 53) % (h - 16)) + 8, 4 + (c % 3), 0, 6.28); ctx.fill(); }
    }
    ctx.fillStyle = 'rgba(147, 53, 40, 0.68)';
    ctx.fillRect(10, h - 22, 12, 14); ctx.fillRect(26, 24, 10, 10); ctx.fillRect(w - 22, h - 22, 12, 14);
  })();

  let scrubbing = false;
  function jumpMinimap(clientX) {
    markUserAction();
    const rect = miniBar.getBoundingClientRect();
    const wx = Q.lerp(Q.WORLD.minX, Q.WORLD.maxX, Q.clamp((clientX - rect.left) / rect.width, 0.02, 0.98));
    camTarget.x = wx;
    camTarget.z = wx < -60 ? 4.0 : (wx < 22 ? Q.lerp(4.0, 6.5, (wx + 60) / 82) : (wx < 135 ? Q.getRiverInfo(wx).z * 0.55 : -9.0));
  }
  miniBar.addEventListener('mousedown', (ev) => { scrubbing = true; jumpMinimap(ev.clientX); });
  window.addEventListener('mousemove', (ev) => { if (scrubbing) jumpMinimap(ev.clientX); });
  window.addEventListener('mouseup', () => { scrubbing = false; });
  miniBar.addEventListener('touchstart', (ev) => { ev.stopPropagation(); scrubbing = true; jumpMinimap(ev.touches[0].clientX); }, { passive: true });
  miniBar.addEventListener('touchmove', (ev) => { ev.stopPropagation(); if (scrubbing) jumpMinimap(ev.touches[0].clientX); }, { passive: true });
  window.addEventListener('touchend', () => { scrubbing = false; });

  const secNameEl = document.getElementById('section-name'), secSubEl = document.getElementById('section-sub'), secDescEl = document.getElementById('section-desc');
  let lastDesc = '';
  const projV = new THREE.Vector3();

  function updateUI(dist) {
    const totalW = Q.WORLD.maxX - Q.WORLD.minX, widthPct = (Q.clamp(dist * 1.45, 16, 175) / totalW) * 100;
    const leftPct = Q.clamp(((camState.x - Q.WORLD.minX) / totalW) * 100 - widthPct * 0.5, 0, 100 - widthPct);
    navBox.style.width = `${widthPct.toFixed(2)}%`;
    navBox.style.left = `${leftPct.toFixed(2)}%`;

    for (const sec of Q.SECTIONS) {
      if (camState.x >= sec.minX && camState.x <= sec.maxX) {
        let desc = sec.subZones[sec.subZones.length - 1].desc;
        for (const sz of sec.subZones) if (camState.x >= sz.minX) { desc = sz.desc; break; }
        if (desc !== lastDesc) { lastDesc = desc; secNameEl.textContent = sec.title; secSubEl.textContent = sec.tag; secDescEl.textContent = desc; }
        break;
      }
    }

    if (showLabels) {
      const hw = window.innerWidth * 0.5, hh = window.innerHeight * 0.5;
      for (const item of poiEls) {
        const dx = item.poi.x - camState.x, dz = item.poi.z - camState.z, d2 = dx * dx + dz * dz;
        if (d2 > 5800) { item.el.style.opacity = '0'; continue; }
        projV.set(item.poi.x, item.poi.y, item.poi.z).project(camera);
        if (projV.z > 1 || Math.abs(projV.x) > 1.05 || Math.abs(projV.y) > 0.95) { item.el.style.opacity = '0'; continue; }
        item.el.style.left = `${(projV.x * hw + hw).toFixed(1)}px`;
        item.el.style.top = `${(-projV.y * hh + hh).toFixed(1)}px`;
        item.el.style.opacity = d2 > 3600 ? ((5800 - d2) / 2200).toFixed(2) : '0.96';
      }
    }
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  setTimeout(() => document.getElementById('loading-mask').classList.add('done'), 160);

  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05), elapsed = clock.elapsedTime;

    if (keys.size > 0) {
      const step = zoomToDist(camTarget.zoom) * dt * 0.68, yr = THREE.MathUtils.degToRad(camTarget.yaw), sinY = Math.sin(yr), cosY = Math.cos(yr);
      if (keys.has('ArrowRight')) { camTarget.x += cosY * step; camTarget.z -= sinY * step; }
      if (keys.has('ArrowLeft'))  { camTarget.x -= cosY * step; camTarget.z += sinY * step; }
      if (keys.has('ArrowUp'))    { camTarget.x -= sinY * step; camTarget.z -= cosY * step; }
      if (keys.has('ArrowDown'))  { camTarget.x += sinY * step; camTarget.z += cosY * step; }
      if (keys.has('+') || keys.has('=')) camTarget.zoom = Q.clamp(camTarget.zoom + dt * 36, 0, 100);
      if (keys.has('-') || keys.has('_')) camTarget.zoom = Q.clamp(camTarget.zoom - dt * 36, 0, 100);
      camTarget.x = Q.clamp(camTarget.x, Q.WORLD.minX + 8, Q.WORLD.maxX - 8);
      camTarget.z = Q.clamp(camTarget.z, Q.WORLD.minZ + 8, Q.WORLD.maxZ - 8);
      syncSliders();
    }

    const sm = 1 - Math.exp(-dt * 10.5);
    camState.x = Q.lerp(camState.x, camTarget.x, sm);
    camState.z = Q.lerp(camState.z, camTarget.z, sm);
    camState.zoom = Q.lerp(camState.zoom, camTarget.zoom, sm);
    camState.pitch = Q.lerp(camState.pitch, camTarget.pitch, sm);
    camState.yaw = Q.lerp(camState.yaw, camTarget.yaw, sm);

    const dist = zoomToDist(camState.zoom), closeF = Q.clamp(1 - (dist - 6.2) / 38, 0, 1);
    const targetFov = Q.lerp(30, 46, closeF);
    if (Math.abs(camera.fov - targetFov) > 0.05) { camera.fov = targetFov; camera.updateProjectionMatrix(); }
    scene.fog.density = Q.lerp(0.0046, 0.0018, closeF);

    const focusY = Q.getSurfaceY(camState.x, camState.z) + Q.lerp(0.4, 1.38, closeF);
    const pitchRad = THREE.MathUtils.degToRad(Q.lerp(camState.pitch, Math.min(camState.pitch, 24), closeF * 0.45));
    const yawRad = THREE.MathUtils.degToRad(camState.yaw), horiz = Math.cos(pitchRad) * dist;

    camera.position.set(camState.x + Math.sin(yawRad) * horiz, focusY + Math.sin(pitchRad) * dist, camState.z + Math.cos(yawRad) * horiz);
    camera.lookAt(camState.x, focusY, camState.z);

    sunLight.position.set(camState.x + 34, 56, camState.z + 28);
    sunLight.target.position.set(camState.x, 0, camState.z);
    sunLight.target.updateMatrixWorld();

    terrain.update(elapsed);
    boats.update(elapsed);
    arch.update(elapsed);
    crowd.update(elapsed, dt);

    updateUI(dist);
    renderer.render(scene, camera);
  }
  animate();
};

window.addEventListener('DOMContentLoaded', Q.initApp);
})();
</script>
</body>
</html>
