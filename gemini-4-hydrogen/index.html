@font-face {
  font-family: "QingmingWenKai";
  src: url("data:font/woff2;base64,${md}") format("woff2");
  font-weight: 400 700;
  font-style: normal;
  font-display: swap;
}

.qm-root {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 20;
  font-family: "QingmingWenKai", "Kaiti SC", "STKaiti", "KaiTi", serif;
  color: #2c2117;
}

.qm-root * {
  box-sizing: border-box;
  font-family: inherit;
}

.qm-top-left {
  position: absolute;
  top: 16px;
  left: 16px;
  max-width: min(360px, calc(100vw - 110px));
  background: rgba(242, 232, 211, 0.90);
  border: 1px solid rgba(92, 68, 42, 0.28);
  padding: 12px 16px;
  border-radius: 4px;
  box-shadow: 0 4px 18px rgba(48, 34, 18, 0.14);
  pointer-events: auto;
}

.qm-sec-title {
  font-size: 20px;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: 0.06em;
  color: #2b1f14;
  margin: 0 0 4px 0;
}

.qm-sec-desc {
  font-size: 13.5px;
  line-height: 1.55;
  color: #4f3d2b;
  margin: 0;
}

.qm-top-right {
  position: absolute;
  top: 16px;
  right: 16px;
  background: rgba(242, 232, 211, 0.88);
  border: 1px solid rgba(92, 68, 42, 0.28);
  border-radius: 4px;
  padding: 14px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  box-shadow: 0 4px 18px rgba(48, 34, 18, 0.14);
}

.qm-vtitle {
  writing-mode: vertical-rl;
  text-orientation: upright;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 0.18em;
  color: #261a10;
  margin: 0;
}

.qm-seal {
  writing-mode: vertical-rl;
  text-orientation: upright;
  font-size: 11px;
  line-height: 1.15;
  color: #f6ede0;
  background: #923a29;
  padding: 4px 3px;
  border-radius: 2px;
  letter-spacing: 0.08em;
}

.qm-hint {
  position: absolute;
  left: 50%;
  bottom: 92px;
  transform: translateX(-50%);
  background: rgba(44, 32, 20, 0.82);
  color: #f3e8d2;
  padding: 7px 16px;
  border-radius: 4px;
  font-size: 13px;
  letter-spacing: 0.03em;
  white-space: nowrap;
  max-width: 92vw;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: opacity 0.55s ease, transform 0.55s ease;
  pointer-events: none;
}

.qm-hint.is-hidden {
  opacity: 0;
  transform: translateX(-50%) translateY(6px);
}

.qm-panel {
  position: absolute;
  right: 16px;
  bottom: 88px;
  width: 228px;
  background: rgba(242, 232, 211, 0.93);
  border: 1px solid rgba(92, 68, 42, 0.3);
  border-radius: 4px;
  box-shadow: 0 6px 22px rgba(42, 28, 14, 0.18);
  pointer-events: auto;
  overflow: hidden;
}

.qm-panel-hdr {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: rgba(226, 211, 182, 0.55);
  border: none;
  border-bottom: 1px solid rgba(92, 68, 42, 0.18);
  color: #2b1f14;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  min-height: 40px;
}

.qm-panel-hdr:hover {
  background: rgba(218, 200, 166, 0.75);
}

.qm-panel-body {
  padding: 10px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.qm-panel.is-collapsed .qm-panel-body {
  display: none;
}

.qm-panel.is-collapsed .qm-panel-hdr {
  border-bottom: none;
}

.qm-slider-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: #463524;
}

.qm-slider-row label {
  width: 34px;
  flex-shrink: 0;
}

.qm-slider-row input[type="range"] {
  flex: 1;
  accent-color: #7d4a28;
  cursor: pointer;
  height: 18px;
}

.qm-btn-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 2px;
}

.qm-btn {
  padding: 6px 10px;
  min-height: 36px;
  font-size: 13.5px;
  border-radius: 3px;
  border: 1px solid rgba(92, 68, 42, 0.34);
  background: rgba(252, 246, 234, 0.85);
  color: #2c2117;
  cursor: pointer;
  transition: background-color 0.15s ease, color 0.15s ease;
  white-space: nowrap;
}

.qm-btn:hover {
  background: #e6d7b9;
}

.qm-btn.is-active {
  background: #7b4827;
  color: #f9f1e2;
  border-color: #693c1e;
}

.qm-minimap-wrap {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 76px;
  background: #cbb690;
  border-top: 1px solid rgba(78, 57, 35, 0.38);
  pointer-events: auto;
  display: flex;
  flex-direction: column;
}

.qm-minimap-labels {
  height: 20px;
  display: flex;
  width: 100%;
  background: rgba(238, 226, 202, 0.94);
  border-bottom: 1px solid rgba(92, 68, 42, 0.2);
  font-size: 12px;
  color: #4a3826;
}

.qm-minimap-sec {
  display: flex;
  align-items: center;
  justify-content: center;
  border-right: 1px dashed rgba(92, 68, 42, 0.28);
  cursor: pointer;
  letter-spacing: 0.12em;
  transition: background-color 0.15s ease;
}

.qm-minimap-sec:last-child {
  border-right: none;
}

.qm-minimap-sec:hover {
  background: rgba(196, 173, 132, 0.35);
}

.qm-minimap-track {
  position: relative;
  flex: 1;
  width: 100%;
  overflow: hidden;
  cursor: grab;
  background: #baa279;
}

.qm-minimap-track:active {
  cursor: grabbing;
}

.qm-minimap-img {
  width: 100%;
  height: 100%;
  object-fit: fill;
  display: block;
  pointer-events: none;
  opacity: 0.96;
}

.qm-minimap-shade-l,
.qm-minimap-shade-r {
  position: absolute;
  top: 0;
  bottom: 0;
  background: rgba(34, 24, 14, 0.34);
  pointer-events: none;
}

.qm-minimap-shade-l { left: 0; }
.qm-minimap-shade-r { right: 0; }

.qm-minimap-box {
  position: absolute;
  top: 2px;
  bottom: 2px;
  border: 2px solid #963726;
  background: rgba(255, 245, 224, 0.12);
  box-shadow: 0 0 0 1px rgba(255, 245, 224, 0.55);
  pointer-events: none;
}

.qm-labels-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.qm-pin {
  position: absolute;
  transform: translate(-50%, -100%);
  background: rgba(246, 236, 214, 0.92);
  border: 1px solid rgba(102, 71, 41, 0.55);
  color: #2f2115;
  padding: 2px 7px;
  font-size: 12.5px;
  line-height: 1.3;
  border-radius: 2px;
  white-space: nowrap;
  box-shadow: 0 2px 6px rgba(42, 28, 14, 0.18);
  pointer-events: none;
}

.qm-pin::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 100%;
  width: 1px;
  height: 10px;
  background: rgba(102, 71, 41, 0.65);
}

@media (max-width: 767px) {
  .qm-top-left {
    top: 10px;
    left: 10px;
    padding: 8px 11px;
    max-width: calc(100vw - 84px);
  }
  .qm-sec-title { font-size: 16px; }
  .qm-sec-desc { font-size: 12px; }
  .qm-top-right { top: 10px; right: 10px; padding: 10px 7px; }
  .qm-vtitle { font-size: 18px; }
  .qm-panel { right: 10px; bottom: 84px; width: 204px; }
  .qm-hint {
    bottom: 132px;
    font-size: 11.5px;
    padding: 5px 10px;
    white-space: normal;
    text-align: center;
    line-height: 1.35;
    max-width: calc(100vw - 24px);
