:root{--paper:#d9c9a0;--ink:#3b2a1a;--panel:rgba(244,232,200,.92);--line:#8a6b3f;--accent:#8c2f1e;--shadow:rgba(60,40,20,.25)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#2a2318;--ink:#eadcb8;--panel:rgba(40,32,22,.92);--line:#a08050;--accent:#d0856a;--shadow:rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--paper:#2a2318;--ink:#eadcb8;--panel:rgba(40,32,22,.92);--line:#a08050;--accent:#d0856a;--shadow:rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:'WK','KaiTi','STKaiti',serif;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
#seg{position:fixed;left:16px;top:14px;max-width:min(46vw,380px);pointer-events:none;text-shadow:0 0 6px var(--paper),0 0 2px var(--paper)}
#seg h1{margin:0 0 6px;font-size:clamp(20px,2.6vw,30px);font-weight:normal;color:var(--accent);letter-spacing:.12em}
#seg p{margin:0;font-size:clamp(13px,1.5vw,16px);line-height:1.7}
#vtitle{position:fixed;right:14px;top:14px;writing-mode:vertical-rl;font-size:clamp(22px,3vw,36px);letter-spacing:.35em;color:var(--accent);pointer-events:none;text-shadow:0 0 6px var(--paper)}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:94px;font-size:13px;background:var(--panel);padding:6px 14px;border-radius:14px;box-shadow:0 2px 10px var(--shadow);transition:opacity 1.2s;pointer-events:none;white-space:nowrap}
#hint.off{opacity:0}
#nav{position:fixed;left:10px;right:10px;bottom:10px;height:64px;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 12px var(--shadow);padding:0 6px}
#navlabels{position:absolute;left:6px;right:6px;top:2px;height:18px;pointer-events:none;font-size:13px;color:var(--ink)}
#navlabels span{position:absolute;transform:translateX(-50%);white-space:nowrap;text-shadow:0 0 4px var(--panel),0 0 2px var(--panel)}
#navc{position:absolute;left:6px;right:6px;top:20px;bottom:6px;width:calc(100% - 12px);height:calc(100% - 26px);display:block;cursor:pointer;touch-action:none;border-radius:3px}
#panel{position:fixed;right:14px;bottom:88px;width:236px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 16px var(--shadow);font-size:14px}
#panel .hd{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;cursor:pointer;background:none;border:0;color:var(--ink);font:inherit;width:100%}
#panel .bd{padding:0 12px 12px}
#panel.collapsed .bd{display:none}
#panel label{display:block;margin-top:8px;font-size:13px}
#panel input[type=range]{width:100%;accent-color:var(--accent)}
#panel .row{display:flex;gap:8px;margin-top:10px}
#panel button{flex:1;font:inherit;font-size:13px;padding:6px 4px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:4px;cursor:pointer}
#panel button:hover{border-color:var(--accent);color:var(--accent)}
#sv{font-size:12px;opacity:.75;margin-top:4px}
@media (max-width:720px){#seg{max-width:calc(100vw - 110px)}#panel{width:200px;bottom:88px}#panel.collapsed{width:auto}#hint{left:12px;transform:none;bottom:94px;font-size:12px;white-space:normal;max-width:calc(100vw - 150px)}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

<canvas id="c" aria-label="三维清明上河图"></canvas>

  </div>
</div>

<script>
/* ===== 00 基础零件 =====
 * 随机数、程序纹理、材质，以及把大量小零件合并成少数网格的 Geo 累加器。
 * 构建时所有模块按文件名顺序拼成同一个 <script>，共享全局作用域。
 */
var QM = window.QM = window.QM || {};
QM.L = 1600;                                  // 卷长（世界单位，约等于米）

function rngFactory(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

var RND = rngFactory(20260714);
function rnd(a = 0, b = 1) { return a + (b - a) * RND(); }
function rint(a, b) { return Math.floor(rnd(a, b + 1)); }
function pick(arr) { return arr[Math.floor(RND() * arr.length)]; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function smooth(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }

// 位置 + 欧拉角 + 缩放 -> 矩阵（角度为弧度，旋转顺序 YXZ）
function M(x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
  return new THREE.Matrix4().compose(
    new THREE.Vector3(x, y, z),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz, 'YXZ')),
    new THREE.Vector3(sx, sy, sz));
}

// 三角形列表（每个三角形是 3 个 [x,y,z]）-> BufferGeometry，可选 uv 函数
function geoFromTris(tris, uvFn = null) {
  const pos = [], uv = [];
  for (const t of tris) for (const p of t) {
    pos.push(p[0], p[1], p[2]);
    if (uvFn) { const q = uvFn(p); uv.push(q[0], q[1]); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  if (uvFn) g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  return g;
}

/* Geo：顶点色累加器。所有零件都写进它，最后 build() 成一个 BufferGeometry。
 * 每个三角形带一点明暗抖动，模拟绢本上墨色的浓淡不均。 */
class Geo {

    for (let i = 0; i < P.count; i++) {
      v.fromBufferAttribute(P, i);
      if (m) v.applyMatrix4(m);
      if (i % 3 === 0) j = 0.9 + 0.2 * RND();
      this.p.push(v.x, v.y, v.z);
      this.c.push(base.r * j, base.g * j, base.b * j);
      if (U) this.u.push(U.getX(i), U.getY(i)); else this.u.push(0, 0);

    return this;
  }

  merge(src, m = null) {
    const v = new THREE.Vector3();
    for (let i = 0; i < src.p.length; i += 3) {
      v.set(src.p[i], src.p[i + 1], src.p[i + 2]);
      if (m) v.applyMatrix4(m);
      this.p.push(v.x, v.y, v.z);

  }
  build() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(this.u, 2));
    g.computeVertexNormals();
    return g;
  }
}

// 静态合并组：键名 == 材质名。世界里不动的东西都进这里，最后每组一个 Mesh。
var SG = {};

function sgMerge(key, src, m) { return sg(key).merge(src, m); }

function flushStatic(scene) {
  for (const key in SG) {
    const g = SG[key];
    if (!g.p.length) continue;
    const mesh = new THREE.Mesh(g.build(), MAT[key]);
    mesh.matrixAutoUpdate = false;
    mesh.updateMatrix();
    scene.add(mesh);
  }
}

/* ---------- 程序纹理（不引用外部图片） ---------- */
var TEX = {}, MAT = {};
function canvasTex(w, h, draw, rep = [1, 1]) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rep[0], rep[1]);
  t.anisotropy = 4;
  return t;
}
function initTex() {
  // 瓦垄：错缝的灰褐瓦片
  TEX.roof = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#6e5d49'; g.fillRect(0, 0, w, h);
    const cols = 8, rows = 10, tw = w / cols, th = h / rows;
    for (let r = 0; r < rows; r++) for (let c = -1; c < cols; c++) {
      const x = c * tw + (r % 2) * tw / 2, y = r * th, s = 0.8 + 0.35 * RND();
      g.fillStyle = `rgb(${(132 * s) | 0},${(116 * s) | 0},${(96 * s) | 0})`;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + tw, y); g.lineTo(x + tw * 0.9, y + th); g.lineTo(x + tw * 0.1, y + th); g.closePath(); g.fill();
      g.fillStyle = 'rgba(40,30,22,0.55)'; g.fillRect(x, y + th - 2, tw, 2);
    }
  });
  // 绢底：暖褐色，带细纹和浅色斑
  TEX.silk = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#8f7b57'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 900; i++) {
      const x = RND() * w, y = RND() * h, r = rnd(2, 14);
      g.fillStyle = RND() < 0.5 ? 'rgba(255,240,200,0.07)' : 'rgba(70,50,25,0.07)';
      g.beginPath(); g.ellipse(x, y, r, r * 0.4, RND() * 3, 0, 7); g.fill();
    }
    g.strokeStyle = 'rgba(90,70,40,0.09)';
    for (let i = 0; i < 160; i++) {
      const x = RND() * w, y = RND() * h;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + rnd(20, 80), y + rnd(-3, 3)); g.stroke();
    }
  }, [1, 1]);
  // 水：浅土黄底上的墨线波纹
  TEX.water = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#6f6349'; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(120,110,80,0.35)';
    for (let i = 0; i < 40; i++) g.fillRect(RND() * w, RND() * h, rnd(20, 60), rnd(2, 5));
    g.strokeStyle = 'rgba(200,185,145,0.5)'; g.lineWidth = 1.3;
    for (let i = 0; i < 80; i++) {
      const x = RND() * w, y = RND() * h;
      g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x + 6, y - 3, x + 12, y + 3, x + 18, y); g.stroke();
    }
  });
  // 茅草
  TEX.thatch = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#8f7a4c'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 520; i++) {
      const x = RND() * w, y = RND() * h;
      g.strokeStyle = RND() < 0.5 ? 'rgba(220,200,130,0.5)' : 'rgba(60,45,25,0.5)';
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + rnd(-6, 6), y + rnd(4, 10)); g.stroke();
    }
  });
  // 城砖
  TEX.brick = canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#8b6b52'; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(55,40,30,0.7)'; g.lineWidth = 2;
    for (let r = 0; r < 8; r++) {
      const y = r * 16;
      g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
      for (let c = 0; c < 4; c++) { const x = c * 32 + (r % 2) * 16; g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 16); g.stroke(); }
    }
  }, [3, 3]);
}
function initMat() {
  MAT.vc = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
  MAT.vc2 = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
  MAT.roof = new THREE.MeshLambertMaterial({ vertexColors: true, map: TEX.roof, side: THREE.DoubleSide });
  MAT.thatch = new THREE.MeshLambertMaterial({ vertexColors: true, map: TEX.thatch, side: THREE.DoubleSide });
  MAT.brick = new THREE.MeshLambertMaterial({ vertexColors: true, map: TEX.brick, side: THREE.DoubleSide });
  MAT.silk = new THREE.MeshLambertMaterial({ vertexColors: true, map: TEX.silk, side: THREE.DoubleSide });
  MAT.water = new THREE.MeshLambertMaterial({ vertexColors: true, map: TEX.water, side: THREE.DoubleSide });
}

/* ===== 10 世界：坐标、地形、河道、道路、虹桥 =====
 * X 沿卷轴：X=0 是卷首（郊野，画卷最右端），X=L 是卷尾（城门街市）。
 * Z 为纵深：河在北（z 约 -22），大路在南（z 约 20），城市沿街布在路两侧。
 * Y 向上，1 单位约 1 米。
 */
QM.riverZ = (x) => -22 + 3 * Math.sin(x / 150);
QM.riverW = (x) => 30 + 10 * smooth(900, 1150, x);          // 河面宽度，近城处略宽
QM.roadZ = (x) => 20 + 6 * smooth(780, 820, x);              // 大路中心线（进城后移到街心）
QM.roadHW = (x) => (9 + 5 * smooth(800, 860, x)) / 2;        // 路半宽
QM.BR = { x: 740, hw: 6, z0: -54, z1: 20, rise: 15 };       // 虹桥：跨河，拱洞顺河向（X）
QM.bridgeY = (z) => {
  const b = QM.BR, c = (b.z0 + b.z1) / 2, h = (b.z1 - b.z0) / 2;
  const t = clamp((z - c) / h, -1, 1);
  return 0.7 + b.rise * Math.sqrt(1 - t * t);
};

// 沿 X 方向的一条带状面（河、路）
function ribbon(g, x0, x1, step, cz, hw, y, col, uvS = 0) {
  const tris = [];
  for (let x = x0; x < x1; x += step) {
    const xa = x, xb = Math.min(x1, x + step);
    const za = cz(xa), zb = cz(xb), wa = hw(xa), wb = hw(xb);
    const a = [xa, y, za - wa], b = [xb, y, zb - wb], c = [xb, y, zb + wb], d = [xa, y, za + wa];
    tris.push([a, b, c], [a, c, d]);
  }
  g.add(geoFromTris(tris, uvS ? (p) => [p[0] / uvS, p[2] / uvS] : null), null, col);
}

function buildGround() {
  // 大地：一整块绢底
  const g = sg('silk');
  const x0 = -300, x1 = 1900, z0 = -260, z1 = 200;
  g.tri([[[x0, 0, z0], [x1, 0, z0], [x1, 0, z1]], [[x0, 0, z0], [x1, 0, z1], [x0, 0, z1]]],
    0xffffff, (p) => [p[0] / 60, p[2] / 60]);
}

function buildRiverAndRoads() {
  // 河岸线（略深的土色）与河水
  ribbon(sg('vc'), 0, QM.L, 6, QM.riverZ, (x) => QM.riverW(x) / 2 + 1.6, 0.012, 0x7d6b48);
  ribbon(sg('water'), 0, QM.L, 6, QM.riverZ, (x) => QM.riverW(x) / 2, 0.02, 0xffffff, 24);
  // 大路：土路，中间略浅
  ribbon(sg('vc'), 0, QM.L, 6, QM.roadZ, QM.roadHW, 0.03, 0xa58c63);
  ribbon(sg('vc'), 0, QM.L, 6, QM.roadZ, (x) => QM.roadHW(x) * 0.45, 0.035, 0xb89e72);
  // 城内十字街：沿 Z 方向的一条路
  sg('vc').box(1340, 0.05, 40, 9, 0.02, 120, 0xa58c63);
}

function buildHills() {
  // 北岸远山与土丘（淡色，雾化后远去）
  const g = sg('vc');
  for (let i = 0; i < 40; i++) {
    const x = rnd(-100, 1700), z = rnd(-170, -250), r = rnd(50, 95), h = rnd(10, 22);
    g.add(new THREE.SphereGeometry(1, 12, 6, 0, Math.PI * 2, 0, Math.PI / 2), M(x, 0, z, 0, 0, 0, r, h, r * 0.8),
      pick([0x7a6b4c, 0x726446, 0x85765a]));
  }
  for (let i = 0; i < 30; i++) {
    const x = rnd(-80, 1650), z = rnd(-100, -140), r = rnd(10, 20), h = rnd(3, 7);
    g.add(new THREE.SphereGeometry(1, 10, 5, 0, Math.PI * 2, 0, Math.PI / 2), M(x, 0, z, 0, 0, 0, r, h, r * 0.7), 0x8a7b58);
  }
  // 田畦：南岸几块较深的地
  for (let i = 0; i < 16; i++) {
    const x = rnd(120, 700), z = rnd(34, 62);
    g.box(x, 0.02, z, rnd(12, 26), 0.03, rnd(6, 10), 0x9a8452, 0, rnd(-0.06, 0.06), 0);

function buildBridge() {
  // 虹桥：拱形桥面（一块带厚度的拱板），拱洞顺河向 X 贯通，船从桥下穿过。
  const b = QM.BR, g = sg('vc2');
  const xa = b.x - b.hw, xb = b.x + b.hw, N = 56;
  const zs = []; for (let i = 0; i <= N; i++) zs.push(lerp(b.z0, b.z1, i / N));
  const top = (z) => QM.bridgeY(z), bot = (z) => QM.bridgeY(z) - 1.3;
  const deck = [], soffit = [], sideA = [], sideB = [];
  for (let i = 0; i < N; i++) {
    const za = zs[i], zb = zs[i + 1];
    const ta = top(za), tb = top(zb), ba = bot(za), bb = bot(zb);
    deck.push([[xa, ta, za], [xb, ta, za], [xb, tb, zb]], [[xa, ta, za], [xb, tb, zb], [xa, tb, zb]]);
    soffit.push([[xa, ba, za], [xb, bb, zb], [xb, ba, za]], [[xa, ba, za], [xa, bb, zb], [xb, bb, zb]]);
    sideA.push([[xa, ba, za], [xa, ta, za], [xa, tb, zb]], [[xa, ba, za], [xa, tb, zb], [xa, bb, zb]]);
    sideB.push([[xb, ba, za], [xb, tb, zb], [xb, ta, za]], [[xb, ba, za], [xb, bb, zb], [xb, tb, zb]]);
  }
  g.tri(deck, 0x8e6d48);
  g.tri(soffit, 0x4e3a25);
  g.tri(sideA, 0x6b5238);
  g.tri(sideB, 0x6b5238);
  // 栏杆：望柱 + 扶手（两侧）
  for (const x of [xa + 0.4, xb - 0.4]) {
    let prev = null;
    for (let i = 0; i <= N; i += 2) {
      const z = zs[i], y = top(z);
      g.stick([x, y, z], [x, y + 1.05, z], 0.07, 0.07, 0x3f2c1b, 4);
      const tp = [x, y + 1.05, z];
      if (prev) g.stick(prev, tp, 0.05, 0.05, 0x3f2c1b, 4);
      prev = tp;
    }
  }
  // 桥两端的石台与岸
  const st = sg('vc');
  st.box(b.x, 0.7, b.z0 - 1.4, 14, 2.2, 3, 0x9e9078);
  st.box(b.x, 0.7, b.z1 + 1.4, 14, 2.2, 3, 0x9e9078);
}

function buildWorldStatic() {
  buildGround();
  buildRiverAndRoads();
  buildHills();
  buildBridge();
}

/* ===== 20 人物、牲口、车、船：实例化骨架与动画 =====
 * 每一类（人、各种牲口、车、船）共用一套零件网格（InstancedMesh），
 * 每个个体只存一组矩阵，每帧按步态更新。零件之间用“轴点”旋转：腿绕胯转，臂绕肩转。
 * 约定：人和牲口的正面朝 +Z；船和车的正面朝 +X（沿河、沿路前进）。
 */
var WHITE = new THREE.Color(1, 1, 1);
var _o = new THREE.Matrix4(), _a = new THREE.Matrix4(), _b = new THREE.Matrix4(), _c = new THREE.Matrix4();
var ZERO = new THREE.Matrix4().makeScale(0, 0, 0);

var ROBES = ['#7b5a3c', '#5f6e5a', '#8c3b2e', '#3e4b61', '#a6875a', '#4d4238', '#6b4f6e', '#c0a77a', '#2f3a33', '#8a7450', '#9c6a4c'];
var PANTS = ['#3c3530', '#4a4236', '#5b4a3a', '#2e2a26', '#6b5a48'];
var SKINS = ['#e6c3a0', '#d9b08a', '#c99a74', '#e9cba9'];
var COATS = { horse: ['#5b4330', '#2e2620', '#8a6a48', '#6e5638'], donkey: ['#7a6a58', '#8e7d68', '#5e5246'], ox: ['#8a6446', '#5e4632', '#a88a62'] };
var PACKS = ['#b59c6a', '#8a3e2a', '#6c7a5e', '#d8c49a', '#7d6a4a'];

/* 通用的实例化骨架：defs = [{name, geo, mat?, pivot?, axis?}] */
class Rig {
  constructor(defs, count) {
    this.count = count; this.parts = {};
    for (const d of defs) {
      const mesh = new THREE.InstancedMesh(d.geo, d.mat || MAT.vc, Math.max(1, count));
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      mesh.frustumCulled = false;
      for (let i = 0; i < Math.max(1, count); i++) mesh.setColorAt(i, WHITE);
      QM.scene.add(mesh);
      this.parts[d.name] = { mesh, pivot: d.pivot || [0, 0, 0], axis: d.axis || 'x' };
    }
  }
  color(part, i, c) { this.parts[part].mesh.setColorAt(i, c); }
  finishColors() { for (const k in this.parts) this.parts[k].mesh.instanceColor.needsUpdate = true; }
  // 把第 i 个实例的某个零件摆到 base 变换下，并绕轴点转 ang 弧度
  put(part, i, base, ang = 0, hide = false) {
    const p = this.parts[part];
    if (hide) { p.mesh.setMatrixAt(i, ZERO); return; }
    if (ang) {
      const pv = p.pivot;
      _a.makeTranslation(pv[0], pv[1], pv[2]);
      if (p.axis === 'z') _b.makeRotationZ(ang); else _b.makeRotationX(ang);
      _c.makeTranslation(-pv[0], -pv[1], -pv[2]);
      _o.multiplyMatrices(base, _a).multiply(_b).multiply(_c);
      p.mesh.setMatrixAt(i, _o);
    } else {
      p.mesh.setMatrixAt(i, base);
    }
  }
  commit() { for (const k in this.parts) this.parts[k].mesh.instanceMatrix.needsUpdate = true; }
}

var CARTS = [];

function wheelGeo(x, y, z, r, th = 0.16) {

}

function addBoat(kind, o) {

/* ---------- 人物的基座矩阵与动画 ---------- */
var _bt = new THREE.Matrix4(), _tmp = new THREE.Matrix4(), _rot = new THREE.Matrix4();
var HUMAN = null, ANIM = {}, CART = {}, BOATR = {};

function pingPong(e, dt) {
  e.x += e.dir * e.speed * dt;
  if (e.x > e.x1) { e.x = e.x1; e.dir = -1; }
  else if (e.x < e.x0) { e.x = e.x0; e.dir = 1; }
  e.ph += dt * e.speed * (e.gait || 4.2);
}

function updateMoving(dt) {
  QM.t = (QM.t || 0) + dt;
  // 船：先算船身矩阵，船上的人跟着它走
  for (const b of BOATS) {
    if (b.mode === 'walk') pingPong(b, dt);
    b.ph += dt;
    b.yaw = b.dir > 0 ? 0 : Math.PI;
    const bob = Math.sin(b.ph * 1.7 + b.x * 0.05) * 0.09;
    const roll = Math.sin(b.ph * 1.1) * 0.035, pitch = Math.sin(b.ph * 0.8) * 0.02;
    b.mat = M(b.x, bob, b.z, pitch, b.yaw, roll);
    BOATR[b.kind].put('hull', b.i, b.mat);
  }
  // 车（牛车带着牛走）
  for (const c of CARTS) {
    if (c.mode === 'walk') pingPong(c, dt);
    c.yaw = c.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
    c.spin += c.dir * c.speed * dt / 1.0;
    _bt.makeRotationY(c.yaw); _bt.setPosition(c.x, 0, c.z);
    const r = CART[c.kind];
    r.put('body', c.i, _bt);
    if (r.parts.wheelL) { r.put('wheelL', c.i, _bt, c.spin); r.put('wheelR', c.i, _bt, c.spin); }
    if (r.parts.wheel) r.put('wheel', c.i, _bt, c.spin);
    if (c.ox >= 0) {                                     // 牛在车前，同步步态
      const a = ANIMALS[c.ox];
      a.x = c.x + c.dir * 3.6; a.z = c.z; a.yaw = c.yaw; a.ph = c.ph; a.mode = 'gait';
      a.dir = c.dir;
    }
    if (c.mode === 'walk') c.ph += 0;                    // 相位由 pingPong 推进
  }
  // 牲口
  for (const a of ANIMALS) {
    if (a.mode === 'walk') { pingPong(a, dt); }
    if (a.mode === 'walk' || a.mode === 'gait') a.yaw = a.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
    const moving = a.mode === 'walk' || a.mode === 'gait';
    const sw = moving ? Math.sin(a.ph) * 0.45 : 0;
    const bob = moving ? Math.abs(Math.sin(a.ph)) * 0.03 : 0;
    _bt.makeRotationY(a.yaw); _bt.setPosition(a.x, a.y + bob, a.z);
    const r = ANIM[a.kind], i = a.i;
    r.put('body', i, _bt); r.put('neck', i, _bt); r.put('head', i, _bt); r.put('tail', i, _bt);
    r.put('legFL', i, _bt, sw); r.put('legFR', i, _bt, -sw);
    r.put('legBL', i, _bt, -sw); r.put('legBR', i, _bt, sw);
    r.put('pack', i, _bt, 0, !a.hasPack);
  }
  // 人
  for (let i = 0; i < PEOPLE.length; i++) {
    const p = PEOPLE[i];
    const sit = p.mode === 'sit';
    let swing = 0, bob = 0;
    if (p.mode === 'walk') {
      pingPong(p, dt);
      p.yaw = p.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
      swing = Math.sin(p.ph) * 0.5;
      bob = Math.abs(Math.sin(p.ph)) * 0.035;
    } else if (p.mode === 'work') {
      p.ph += dt * 1.5;
      bob = Math.abs(Math.sin(p.ph)) * 0.02;
    } else {
      p.ph += dt * 0.6;
      bob = Math.sin(p.ph) * 0.006;
    }
    _rot.makeRotationY(p.yaw);
    if (p.boat) {
      _tmp.makeTranslation(p.lx, p.ly, p.lz);
      _bt.multiplyMatrices(p.boat.mat, _tmp).multiply(_rot);
    } else {
      _bt.copy(_rot);
      _bt.setPosition(p.x, p.y + bob + (sit ? -0.42 : 0), p.z);
    }
    let legA = sit ? -1.45 : swing, legB = sit ? -1.45 : -swing;
    let aL = p.carry ? -1.1 : -swing * 0.8, aR = p.carry ? -1.1 : swing * 0.8;
    if (p.mode === 'work') { aR = -0.9 + Math.sin(p.ph) * 0.6; aL = -0.25; }
    if (p.mode === 'idle' || sit) { aL = 0; aR = 0; }
    const H = HUMAN;
    H.put('legL', i, _bt, legA); H.put('legR', i, _bt, legB);
    H.put('torso', i, _bt);
    H.put('armL', i, _bt, aL); H.put('armR', i, _bt, aR);
    H.put('head', i, _bt);
    H.put('hair', i, _bt, 0, p.hat !== 'none');
    H.put('cap', i, _bt, 0, p.hat !== 'cap');
    H.put('straw', i, _bt, 0, p.hat !== 'straw');
    H.put('pole', i, _bt, 0, !p.carry);
  }
  // 提交
  if (HUMAN) HUMAN.commit();
  for (const k in ANIM) ANIM[k].commit();
  for (const k in CART) CART[k].commit();
  for (const k in BOATR) BOATR[k].commit();
}

/* 按类型建立实例化骨架，并把每个个体的下标写回 */
function buildRigs() {
  HUMAN = new Rig(humanDefs(), PEOPLE.length);
  PEOPLE.forEach((p, i) => {
    const robe = new THREE.Color(p.robe), pants = new THREE.Color(p.pants), skin = new THREE.Color(p.skin);
    HUMAN.color('torso', i, robe); HUMAN.color('armL', i, robe); HUMAN.color('armR', i, robe);
    HUMAN.color('legL', i, pants); HUMAN.color('legR', i, pants);
    HUMAN.color('head', i, skin);
    HUMAN.color('hair', i, WHITE); HUMAN.color('cap', i, WHITE); HUMAN.color('straw', i, WHITE); HUMAN.color('pole', i, WHITE);
  });
  HUMAN.finishColors();

  for (const kind of ['horse', 'donkey', 'ox']) {
    const list = ANIMALS.filter((a) => a.kind === kind);
    list.forEach((a, i) => { a.i = i; });
    if (!list.length) continue;
    const r = new Rig(animalDefs(kind), list.length);
    list.forEach((a, i) => {
      const c = new THREE.Color(a.coat);
      for (const part of ['body', 'neck', 'head', 'tail', 'legFL', 'legFR', 'legBL', 'legBR']) r.color(part, i, c);
      r.color('pack', i, new THREE.Color(a.pack));
    });
    r.finishColors();
    ANIM[kind] = r;
  }
  for (const kind of ['oxcart', 'barrow', 'sedan']) {
    const list = CARTS.filter((c) => c.kind === kind);
    list.forEach((c, i) => { c.i = i; });
    if (!list.length) continue;
    CART[kind] = new Rig(cartDefs(kind), list.length);
    CART[kind].finishColors();
  }
  // 牛车的牛需要知道自己在 ANIMALS 里的位置
  for (const c of CARTS) c.ox = -1;
  for (const kind of ['cargo', 'small']) {
    const list = BOATS.filter((b) => b.kind === kind);
    list.forEach((b, i) => { b.i = i; });
    if (!list.length) continue;
    const r = new Rig([{ name: 'hull', geo: boatGeo(kind), mat: MAT.vc2 }], list.length);
    list.forEach((b, i) => r.color('hull', i, new THREE.Color(b.tint)));
    r.finishColors();
    BOATR[kind] = r;
  }
}

/* ===== 30 建筑：屋顶、民居、酒楼、城门、彩楼欢门、店名题签 =====
 * 建筑在局部坐标里搭好（台基在地面 y=0，正面朝 +Z），再用矩阵放到世界里。
 */

// 庑殿/歇山式的四坡屋顶，屋脊沿 X，四角翘起（curl），檐口略挑出（ov）
function roofTris(w, d, y0, rise, ov, curl) {
  const E = w / 2 + ov, F = d / 2 + ov, rx = Math.max(0, E - F) * 0.9;
  const yr = y0 + rise, yc = y0 + curl;
  const C = (sx, sz) => [sx * E, yc, sz * F];
  const Mid = (sz) => [0, y0, sz * F];          // 檐口中点略低，形成“凹”的檐线
  const R = (sx) => [sx * rx, yr, 0];
  const t = [];
  for (const sz of [1, -1]) {
    t.push([C(-1, sz), Mid(sz), R(-1)], [Mid(sz), C(1, sz), R(1)], [Mid(sz), R(1), R(-1)]);
  }
  t.push([C(-1, -1), C(-1, 1), R(-1)], [C(1, 1), C(1, -1), R(1)]);
  return t;
}
const ROOF_UV = (p) => [p[0] * 0.3, (p[2] + p[1]) * 0.3];

// 民居 / 酒楼 / 草屋。o: {x,z,w,d,h,ry,y0,floors,thatch,wall,balcony,name,shop}
function hall(o) {
  QM.halls = (QM.halls || 0) + 1;
  const w = o.w, d = o.d, h = o.h, y0 = o.y0 || 0, fl = o.floors || 1;
  const T = M(o.x, y0, o.z, 0, o.ry || 0, 0);
  const lw = new Geo(), lr = new Geo();
  const base = o.thatch ? 0 : 0.6;
  const tim = 0x4a3422, wall = o.wall ?? 0xc9b48b;
  if (!o.thatch) lw.box(0, 0.3, 0, w + 1.6, 0.6, d + 1.6, 0xa39a88);             // 台基
  const fh = h / fl;
  for (let f = 0; f < fl; f++) {
    const ins = f === 0 ? 0 : 0.8;
    const ww = w - 2 * ins, dd = d - 2 * ins, yb = base + f * fh;
    lw.box(0, yb + fh / 2, 0, ww, fh, dd, o.thatch ? 0xa98c5e : wall);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) lw.cyl(sx * ww / 2, yb + fh / 2, sz * dd / 2, 0.16, 0.16, fh, 6, tim);
    const fz = dd / 2 + 0.04;
    if (f === 0 && !o.thatch) {
      if (o.shop) {                                                  // 铺面：敞开的门面 + 柜台
        lw.box(0, yb + fh * 0.42, fz, ww * 0.8, fh * 0.8, 0.05, 0x2a1d12);
        lw.box(0, yb + 0.5, fz + 0.5, ww * 0.7, 0.9, 0.9, 0x6d5233);
      } else {
        lw.box(0, yb + fh * 0.38, fz, ww * 0.34, fh * 0.76, 0.06, 0x2c2016);
      }
    } else if (f === 0 && o.thatch) {
      lw.box(0, yb + 1.0, fz, 1.0, 1.9, 0.05, 0x2c2016);
    }
    if (!o.thatch) {
      for (const sx of [-1, 1]) {
        if (f === 0 && !o.shop && sx < 0) continue;
        const wx = sx * ww * 0.3;
        lw.box(wx, yb + fh * 0.6, fz, ww * 0.22, fh * 0.42, 0.05, 0x3d2c1b);     // 窗框
        lw.box(wx, yb + fh * 0.6, fz + 0.03, ww * 0.18, fh * 0.36, 0.04, 0x9a8a66); // 窗纸
        lw.box(wx, yb + fh * 0.6, fz + 0.05, 0.05, fh * 0.36, 0.03, 0x3d2c1b);   // 格子
        lw.box(wx, yb + fh * 0.6, fz + 0.05, ww * 0.18, 0.05, 0.03, 0x3d2c1b);
      }
    }
    if (o.balcony && f === 0 && fl > 1) {                           // 二层平座 + 栏杆
      const by = yb + fh;
      lw.box(0, by + 0.08, 0, w + 2.4, 0.16, d + 2.4, 0x6d5233);
      const rh = 1.0;
      for (const sz of [-1, 1]) lw.box(0, by + rh / 2 + 0.16, sz * (d / 2 + 1.1), w + 2.4, 0.08, 0.08, 0x3f2c1b)
        .box(0, by + 0.5 + 0.16, sz * (d / 2 + 1.1), w + 2.4, 0.06, 0.06, 0x3f2c1b);
      for (const sx of [-1, 1]) lw.box(sx * (w / 2 + 1.1), by + rh / 2 + 0.16, 0, 0.08, 0.08, d + 2.4, 0x3f2c1b);
      for (let k = 0; k <= 6; k++) {
        const px = -w / 2 - 1.1 + (w + 2.4) * k / 6;
        lw.cyl(px, by + 0.16 + rh / 2, d / 2 + 1.1, 0.04, 0.04, rh, 4, 0x3f2c1b)
          .cyl(px, by + 0.16 + rh / 2, -d / 2 - 1.1, 0.04, 0.04, rh, 4, 0x3f2c1b);
      }
    }
  }
  // 屋顶
  const top = base + h;
  const rise = o.thatch ? Math.min(w, d) * 0.55 : Math.min(w, d) * 0.28 + 0.6;
  const ov = o.thatch ? 1.4 : 1.1;
  lr.tri(roofTris(w, d, top, rise, ov, o.thatch ? 0.5 : 0.9), 0xffffff, ROOF_UV);
  if (!o.thatch) lw.box(0, top + rise + 0.05, 0, Math.max(0.3, w - d), 0.16, 0.36, 0x3b3026);   // 屋脊
  sgMerge('vc', lw, T);
  sgMerge(o.thatch ? 'thatch' : 'roof', lr, T);
  if (o.name) {
    const p = new THREE.Vector3(0, y0 + (o.balcony ? h * 0.55 : Math.min(h, 4.5)), d / 2 + 0.7).applyMatrix4(T);
    label(o.name, p.x, p.y, p.z, o.ry || 0, o.labelH || 4.6);
  }
  return T;
}

// 城门：墙台、拱形门洞（上方砖拱）、木构城楼
function buildGate() {
  const gx = 1060, zA = 19, zB = 33;
  const walls = sg('brick');
  walls.box(gx, 4.5, (zA - 6) / 2, 10, 9, zA + 6, 0xffffff);
  walls.box(gx, 4.5, (zB + 62) / 2, 10, 9, 62 - zB, 0xffffff);
  walls.box(gx, 6.9, (zA + zB) / 2, 10, 4.8, zB - zA, 0xffffff);          // 门洞上方砖拱
  walls.box(gx, 4.5 + 4.5, zA - 0.5, 11, 1.2, 1.2, 0xffffff);
  walls.box(gx, 4.5 + 4.5, zB + 0.5, 11, 1.2, 1.2, 0xffffff);
  hall({ x: gx, z: (zA + zB) / 2, y0: 9.5, w: 12, d: 12, h: 6.5, floors: 2, wall: 0x7a4a2c, labelH: 0 });
}

// 彩楼欢门：横跨大街的木构牌楼，两根红柱 + 横梁 + 小屋顶 + 彩幡
function buildCaiLou(x) {
  const lw = new Geo(), lr = new Geo();
  const z0 = 18.2, z1 = 33.8;
  lw.cyl(x, 4.2, z0, 0.3, 0.3, 8.4, 8, 0x8a2c1e).cyl(x, 4.2, z1, 0.3, 0.3, 8.4, 8, 0x8a2c1e);
  lw.box(x, 8.0, (z0 + z1) / 2, 1.0, 0.9, z1 - z0 + 1.2, 0x7a2a1c);
  lw.box(x, 7.1, (z0 + z1) / 2, 0.6, 0.6, z1 - z0 + 0.4, 0x5b3a22);
  for (const sx of [-1, 1]) lw.box(x + sx * 0.9, 9.5, (z0 + z1) / 2, 0.14, 2.0, 6, 0xc03a22);   // 彩幡
  // 小屋顶（沿 Z 方向）
  const T = M(x, 8.5, (z0 + z1) / 2, 0, Math.PI / 2, 0);
  lr.tri(roofTris(z1 - z0 + 3, 4.0, 0, 1.6, 0.8, 0.5), 0x7a6040, ROOF_UV);
  sgMerge('vc', lw, null);
  sgMerge('roof', lr, T);
}

// 招牌题签（竖排字）：name 为店名；(x,y,z) 为挂牌中心；ry 为朝向
var LABELS = [];
function label(name, x, y, z, ry, h) {
  LABELS.push({ name, x, y, z, ry, h });
}
function buildLabels(group) {
  for (const l of LABELS) {
    const chars = [...l.name];
    const cw = 96, ch = 96;
    const cv = document.createElement('canvas');
    cv.width = cw; cv.height = ch * chars.length + 24;
    const g = cv.getContext('2d');
    g.fillStyle = '#eadbb0'; g.fillRect(0, 0, cv.width, cv.height);
    g.strokeStyle = '#4a2c18'; g.lineWidth = 6; g.strokeRect(3, 3, cv.width - 6, cv.height - 6);
    g.fillStyle = '#3a2412'; g.font = '70px WK, KaiTi, serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    chars.forEach((c, i) => g.fillText(c, cw / 2, 12 + ch * i + ch / 2));
    const tex = new THREE.CanvasTexture(cv);
    tex.anisotropy = 4;
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.0, cv.height / cw), new THREE.MeshBasicMaterial({ map: tex }));
    const hs = l.h / (cv.height / cw);
    mesh.scale.set(hs, hs, hs);
    mesh.position.set(l.x, l.y, l.z);
    mesh.rotation.y = l.ry;
    group.add(mesh);
  }
}

// 幌子（酒旗、布招）：细竿 + 一面布
function flagPole(x, y, z, col, ry = 0) {
  const g = sg('vc');
  const T = new THREE.Matrix4().makeRotationY(ry).setPosition(x, y, z);
  const lw = new Geo();
  lw.cyl(0, 2.6, 0, 0.06, 0.06, 5.2, 5, 0x4a3524);
  lw.box(0.7, 4.4, 0.02, 1.2, 1.4, 0.04, col);
  sgMerge('vc', lw, T);
}

/* ===== 40 树木与船体 =====
 * 老柳：粗矮歪斜的主干，放射出细枝，早春枝叶稀疏。
 * 枯树：多枝杈的杂树。船：两头上翘的漕船、带席篷与舵楼的船身。
 */

function willow(x, z, s = 1) {
  QM.willows = (QM.willows || 0) + 1;
  const G = sg('vc'), trunk = 0x5a4530, leaf = 0xa5a878;
  const base = [x, 0, z];
  const top = [x + rnd(-0.4, 0.4) * s, 4.0 * s, z + rnd(-0.3, 0.3) * s];
  G.stick(base, top, 0.42 * s, 0.22 * s, trunk, 5);
  G.stick([x, 2.2 * s, z], [x - 0.9 * s, 3.9 * s, z + 0.6 * s], 0.14 * s, 0.07 * s, trunk, 4);
  const n = rint(15, 21);
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), L = rnd(3.5, 5.6) * s;
    const ca = Math.cos(a), sa = Math.sin(a);
    const p0 = [x + ca * 0.3 * s, rnd(2.8, 4.2) * s, z + sa * 0.3 * s];
    const p1 = [p0[0] + ca * L * 0.6, p0[1] + rnd(0.3, 0.9) * s, p0[2] + sa * L * 0.6];
    const p2 = [p1[0] + ca * L * 0.5, p1[1] - L * 0.8 * s, p1[2] + sa * L * 0.5];
    const p3 = [p2[0] + ca * 0.3, p2[1] - L * 0.6 * s, p2[2] + sa * 0.3];
    G.stick(p0, p1, 0.12 * s, 0.08 * s, trunk, 4);
    G.stick(p1, p2, 0.08 * s, 0.045 * s, trunk, 4);
    G.stick(p2, p3, 0.045 * s, 0.015 * s, trunk, 3);
    // 早春：只在枝梢点几片新叶
    for (const p of [p2, p3]) if (RND() < 0.75) G.box(p[0], p[1], p[2], 0.4 * s, 0.12 * s, 0.28 * s, leaf, rnd(0, 3), rnd(0, 3), 0);
    if (RND() < 0.5) G.stick(p2, [p2[0] + ca * 0.5, p2[1] - 1.1 * s, p2[2] + sa * 0.5], 0.03 * s, 0.01 * s, trunk, 3);
  }
}

function deadTree(x, z, s = 1, depth = 3) {
  QM.deadTrees = (QM.deadTrees || 0) + 1;
  const G = sg('vc'), col = 0x4a3d2e;
  G.stick([x, 0, z], [x + rnd(-0.3, 0.3), 3.5 * s, z], 0.5 * s, 0.28 * s, col, 6);
  const branch = (p, dir, len, r, dpt) => {
    if (dpt === 0 || len < 0.3) return;
    const q = [p[0] + dir[0] * len, p[1] + dir[1] * len, p[2] + dir[2] * len];
    G.stick(p, q, r, r * 0.7, col, 4);
    const k = rint(2, 3);
    for (let i = 0; i < k; i++) {
      const nd = nrm3([dir[0] + rnd(-0.8, 0.8), dir[1] + rnd(-0.1, 0.5), dir[2] + rnd(-0.8, 0.8)]);
      branch(q, nd, len * rnd(0.6, 0.78), r * 0.7, dpt - 1);
    }
  };
  for (let i = 0; i < 4; i++) {
    const a = rnd(0, Math.PI * 2);
    const dir = nrm3([Math.cos(a) * 0.8, rnd(0.3, 0.7), Math.sin(a) * 0.8]);
    branch([x, 3 * s, z], dir, rnd(1.6, 2.4) * s, 0.22 * s, depth);
  }
}

// 船体几何（局部坐标：船头朝 +X，水面在 y=0）
function boatGeo(kind) {
  const g = new Geo();
  if (kind === 'cargo') {
    const Lh = 11;
    const hull = new THREE.BoxGeometry(22, 2.2, 5.4, 16, 1, 3);
    const p = hull.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const u = x / Lh;
      const nz = y > 0 ? z * (1 - 0.35 * u * u) : z * (1 - 0.15 * u * u);   // 两端收窄
      const lift = 1.4 * Math.pow(Math.abs(u), 3) * (y > 0 ? 1 : 0.6);      // 首尾上翘
      p.setXYZ(i, x, y + lift, nz);
    }
    g.add(hull, M(0, 1.1, 0), 0x6b4d2c);
    // 席篷：半圆拱，跨在船身中段
    const cover = [];
    const xA = -7, xB = 7, N = 8;
    for (let i = 0; i < N; i++) {
      const a0 = i / N * Math.PI, a1 = (i + 1) / N * Math.PI;
      const P = (xx, a) => [xx, 2.2 + 1.8 * Math.sin(a), 2.3 * Math.cos(a)];
      cover.push([P(xA, a0), P(xB, a0), P(xB, a1)], [P(xA, a0), P(xB, a1), P(xA, a1)]);
    }
    g.tri(cover, 0xcdbb8e);
    // 货物：舱中的包裹
    g.box(-3, 1.9, 0, 4.2, 1.2, 3.6, 0xa58d5e).box(2.8, 1.9, 0, 3.0, 1.2, 3.6, 0x8c7048);
    // 舵楼与大舵
    g.box(Lh - 3.2, 3.0, 0, 3.4, 1.6, 3.6, 0x5a4a34);
    g.tri(roofTris(3.8, 3.4, 3.8, 0.7, 0.3, 0.2), 0x4a3a28);
    g.stick([Lh - 1.2, 1.0, 0], [Lh + 1.2, -1.2, 0], 0.12, 0.1, 0x4a3524, 4);
    g.box(Lh + 1.0, -0.6, 0, 0.2, 2.2, 1.4, 0x3f2c1b);
    // 人字桅（立起的一根桅杆，不张帆）
    g.stick([-4, 2.2, 0], [-4.6, 11.5, 0], 0.13, 0.08, 0x4a3524, 5);
  } else {
    const hull = new THREE.BoxGeometry(9, 1.0, 2.2, 10, 1, 2);
    const p = hull.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const u = x / 4.5;
      p.setXYZ(i, x, y + 0.5 * Math.pow(Math.abs(u), 3) * (y > 0 ? 1 : 0.6), z * (1 - 0.2 * u * u));
    }
    g.add(hull, M(0, 0.5, 0), 0x6e5030);
    g.stick([-1.0, 0.7, 1.2], [-2.8, 0.2, 2.4], 0.05, 0.04, 0x4a3524, 4);   // 橹
    g.stick([-1.0, 0.7, -1.2], [-2.8, 0.2, -2.4], 0.05, 0.04, 0x4a3524, 4);
  }
  return g.build();
}

/* ===== 60 镜头与界面 =====
 * 镜头：目标点（tx,tz）+ 偏航 yaw + 俯仰 pitch + 距离 dist，三者都平滑追随。
 * 左键拖动平移；右键或 Shift+左键转视角；滚轮/双指捏合缩放；触屏双指可旋转和俯仰。
 */
var CAM_DEFAULT = { tx: 1080, tz: 14, yaw: 0.2, pitch: 0.42, dist: 230 };
var CAM = Object.assign({}, CAM_DEFAULT);     // 目标值（用户期望）
var CUR = Object.assign({}, CAM_DEFAULT);     // 当前值（渲染用）
var FOV = 40;
var SEGS = [
  { x1: 700, t: '郊野春色', d: '春寒未散，柳色初青。驮队、行人与牛车沿大路向汴京而行，远处村舍疏落。' },
  { x1: 800, t: '汴河虹桥', d: '汴河横贯，拱形虹桥跨水而立，桥上观者如堵；河中漕船穿桥而过，岸边船工忙着摇橹。' },
  { x1: 1e9, t: '城门街市', d: '城门高耸，街市繁盛。彩楼欢门横于大街，十千脚店、孙羊正店、赵太丞家、久住王员外家沿街列开。' },
];
var labelsOn = true;
var segIdx = -1;
var hintOff = false;

QM.setView = (v) => { Object.assign(CAM, v); Object.assign(CUR, v); };
QM.state = () => ({ CAM: Object.assign({}, CAM), CUR: Object.assign({}, CUR) });

function clampCam() {
  CAM.tx = clamp(CAM.tx, -40, QM.L + 40);
  CAM.tz = clamp(CAM.tz, -110, 110);
  CAM.pitch = clamp(CAM.pitch, 0.08, 1.42);
  CAM.dist = clamp(CAM.dist, 5, 900);
}

function stepCam(dt) {
  const k = 1 - Math.exp(-dt * 9);
  for (const key of ['tx', 'tz', 'yaw', 'pitch', 'dist']) CUR[key] += (CAM[key] - CUR[key]) * k;
  const c = QM.camera, th = CUR.yaw, ph = CUR.pitch, d = CUR.dist;
  c.position.set(CUR.tx + d * Math.sin(th) * Math.cos(ph), d * Math.sin(ph), CUR.tz + d * Math.cos(th) * Math.cos(ph));
  c.lookAt(CUR.tx, 0, CUR.tz);
  c.near = Math.max(0.15, d * 0.01);
  c.updateProjectionMatrix();
}

// 视野在卷轴方向上的宽度（世界单位）
function visibleWidth() {
  return 2 * CUR.dist * Math.tan(FOV * Math.PI / 360) * (innerWidth / innerHeight);
}

function bindInput(canvas) {
  const ptrs = new Map();
  let mode = null, pinchD = 0, pinchA = 0;
  const hideHint = () => { if (!hintOff) { hintOff = true; document.getElementById('hint').classList.add('off'); } };
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    hideHint();
    if (ptrs.size === 1) mode = (e.button === 2 || e.shiftKey) ? 'rot' : 'pan';
    else { mode = 'pinch'; const [a, b] = [...ptrs.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); pinchA = Math.atan2(b.y - a.y, b.x - a.x); }
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = ptrs.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 1) {
      if (mode === 'rot' || e.shiftKey && (e.buttons & 1)) {
        CAM.yaw -= dx * 0.006;
        CAM.pitch = clamp(CAM.pitch - dy * 0.004, 0.08, 1.42);
      } else {
        // 左键拖动：地面跟随鼠标移动（拖向右，画面右移 -> 目标向左）
        const s = CAM.dist * 0.0022;
        const R = [Math.cos(CAM.yaw), -Math.sin(CAM.yaw)];
        const F = [-Math.sin(CAM.yaw), -Math.cos(CAM.yaw)];
        const fk = s / Math.max(0.35, Math.sin(CAM.pitch));
        CAM.tx += -R[0] * dx * s + F[0] * dy * fk;
        CAM.tz += -R[1] * dx * s + F[1] * dy * fk;
      }
    } else if (ptrs.size >= 2) {
      const [a, b] = [...ptrs.values()];
      const D = Math.hypot(a.x - b.x, a.y - b.y), A = Math.atan2(b.y - a.y, b.x - a.x);
      if (pinchD > 0) CAM.dist *= pinchD / D;
      CAM.yaw -= (A - pinchA);
      pinchD = D; pinchA = A;
    }
    clampCam();
  });
  const up = (e) => { ptrs.delete(e.pointerId); if (ptrs.size === 0) mode = null; };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault(); hideHint();
    CAM.dist *= Math.exp(e.deltaY * 0.0012);
    clampCam();
  }, { passive: false });
  window.addEventListener('keydown', (e) => {
    const s = CAM.dist * 0.06;
    const R = [Math.cos(CAM.yaw), -Math.sin(CAM.yaw)], F = [-Math.sin(CAM.yaw), -Math.cos(CAM.yaw)];
    let used = true;
    if (e.key === 'ArrowLeft') { CAM.tx -= R[0] * s; CAM.tz -= R[1] * s; }
    else if (e.key === 'ArrowRight') { CAM.tx += R[0] * s; CAM.tz += R[1] * s; }
    else if (e.key === 'ArrowUp') { CAM.tx += F[0] * s; CAM.tz += F[1] * s; }
    else if (e.key === 'ArrowDown') { CAM.tx -= F[0] * s; CAM.tz -= F[1] * s; }
    else if (e.key === '+' || e.key === '=') CAM.dist *= 0.85;
    else if (e.key === '-' || e.key === '_') CAM.dist /= 0.85;
    else used = false;
    if (used) { hideHint(); clampCam(); e.preventDefault(); }
  });
}

function bindNav() {
  const nav = document.getElementById('nav'), cv = document.getElementById('navc');
  const toX = (clientX) => {
    const r = cv.getBoundingClientRect();
    const u = clamp((clientX - r.left) / r.width, 0, 1);
    return (1 - u) * QM.L;
  };
  let drag = false;
  const go = (e) => {
    const vis = visibleWidth();
    const x = toX(e.clientX);
    // 点在框内时保持相对位置不跳
    CAM.tx = x;
    clampCam();
  };
  cv.addEventListener('pointerdown', (e) => { drag = true; cv.setPointerCapture(e.pointerId); go(e); document.getElementById('hint').classList.add('off'); hintOff = true; });
  cv.addEventListener('pointermove', (e) => { if (drag) go(e); });
  cv.addEventListener('pointerup', () => { drag = false; });
  cv.addEventListener('pointercancel', () => { drag = false; });
}

function resizeNav() {
  const cv = document.getElementById('navc');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(cv.clientWidth * dpr);
  cv.height = Math.round(cv.clientHeight * dpr);

function drawNav() {
  const cv = document.getElementById('navc');
  const g = cv.getContext('2d'), W = cv.width, H = cv.height;
  if (NAV_IMG.complete && NAV_IMG.naturalWidth) g.drawImage(NAV_IMG, 0, 0, W, H);
  else { g.fillStyle = '#c9b58a'; g.fillRect(0, 0, W, H); }
  const vis = visibleWidth();
  const u0 = clamp(1 - (CUR.tx + vis / 2) / QM.L, 0, 1), u1 = clamp(1 - (CUR.tx - vis / 2) / QM.L, 0, 1);
  const x0 = u0 * W, w = Math.max(6, (u1 - u0) * W);
  g.fillStyle = 'rgba(255,248,225,0.2)'; g.fillRect(x0, 0, w, H);
  g.strokeStyle = '#8c2f1e'; g.lineWidth = 2 * (W / cv.clientWidth) * 0.5 + 1;
  g.strokeRect(x0 + 1, 1, w - 2, H - 2);
  // 段落分界
  g.strokeStyle = 'rgba(60,40,20,0.55)'; g.lineWidth = 1;
  for (const X of [700, 800]) { const x = (1 - X / QM.L) * W; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
}

function buildNavLabels() {
  const box = document.getElementById('navlabels');
  const items = [['郊野春色', 350], ['汴河虹桥', 740], ['城门街市', 1200]];
  for (const [t, X] of items) {
    const s = document.createElement('span');
    s.textContent = t;
    s.style.left = ((1 - X / QM.L) * 100) + '%';
    box.appendChild(s);
  }
}

function syncPanel() {
  const sz = document.getElementById('sz'), sp = document.getElementById('sp'), sy = document.getElementById('sy');
  if (document.activeElement !== sz) {
    const t = (Math.log(CAM.dist) - Math.log(5)) / (Math.log(900) - Math.log(5));
    sz.value = Math.round((1 - t) * 100);
  }
  if (document.activeElement !== sp) sp.value = Math.round(CAM.pitch * 180 / Math.PI);
  if (document.activeElement !== sy) sy.value = Math.round(((CAM.yaw * 180 / Math.PI + 180) % 360 + 360) % 360 - 180);
  document.getElementById('sv').textContent = `俯仰 ${Math.round(CAM.pitch * 180 / Math.PI)}°`;
}

function bindPanel() {
  const panel = document.getElementById('panel');
  const sz = document.getElementById('sz'), sp = document.getElementById('sp'), sy = document.getElementById('sy');
  if (window.innerWidth < 720) panel.classList.add('collapsed');
  document.getElementById('ptog').addEventListener('click', () => panel.classList.toggle('collapsed'));
  sz.addEventListener('input', () => { const t = 1 - sz.value / 100; CAM.dist = Math.exp(Math.log(5) + t * (Math.log(900) - Math.log(5))); clampCam(); });
  sp.addEventListener('input', () => { CAM.pitch = sp.value * Math.PI / 180; clampCam(); });
  sy.addEventListener('input', () => { CAM.yaw = sy.value * Math.PI / 180; clampCam(); });
  const bl = document.getElementById('blabel');
  bl.addEventListener('click', () => {
    labelsOn = !labelsOn;
    QM.labelGroup.visible = labelsOn;
    bl.textContent = labelsOn ? '题签：开' : '题签：关';
    bl.setAttribute('aria-pressed', String(labelsOn));
  });
  document.getElementById('brst').addEventListener('click', () => { Object.assign(CAM, CAM_DEFAULT); clampCam(); });
}

function updateTitle() {
  const i = SEGS.findIndex((s) => CUR.tx < s.x1);
  const idx = i < 0 ? SEGS.length - 1 : i;
  if (idx !== segIdx) {
    segIdx = idx;
    document.getElementById('st').textContent = SEGS[idx].t;
    document.getElementById('sd').textContent = SEGS[idx].d;
  }
}

function updateUI() {
  drawNav();
  syncPanel();
  updateTitle();
}

/* ===== 90 入口：渲染器、灯光、字体、建场景、主循环 ===== */
async function main() {
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  QM.renderer = renderer;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xd9c9a2);
  scene.fog = new THREE.Fog(0xd3c294, 420, 1500);
  QM.scene = scene;
  const camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, 0.2, 4000);
  QM.camera = camera;

  // 灯光：偏暖的侧光 + 半球环境光，接近绢本的温和明暗
  scene.add(new THREE.HemisphereLight(0xfff4dc, 0x6b5a40, 0.85));
  const sun = new THREE.DirectionalLight(0xfff0d2, 0.55);
  sun.position.set(-120, 260, 160);
  scene.add(sun);

  // 字体：等字体载入后再画题签（字体已内嵌）
  try { await document.fonts.load('40px WK'); } catch (e) { /* 失败则用楷体回退 */ }

  initTex();
  initMat();
  buildScene();
  flushStatic(scene);
  QM.labelGroup = new THREE.Group();
  scene.add(QM.labelGroup);
  buildLabels(QM.labelGroup);
  buildRigs();

  resizeNav();
  buildNavLabels();
  bindInput(canvas);
  bindNav();
  bindPanel();
  QM.labelGroup.visible = true;

  const onResize = () => {
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    resizeNav();
  };
  window.addEventListener('resize', onResize);
  onResize();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    stepCam(dt);
    updateMoving(dt);
    updateUI();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  QM.ready = true;
}

try {
  main();
} catch (err) {
  console.error(err);
  const hint = document.getElementById('hint');
  if (hint) hint.textContent = '页面初始化失败：' + err.message;
}

</script>
