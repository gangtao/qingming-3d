<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>清明上河图 · 三维长卷</title>
<style>
@font-face {
  font-family: "LXGW WenKai";
  src: url(data:font/woff2;base64,%%FONT%%) format("woff2");
  font-display: block;
}
:root {
  --silk: #c9b089;
  --ink: #2b231c;
  --paper: rgba(236, 224, 198, 0.88);
  --seal: #a8382a;
  --nav-h: 66px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--silk); color: var(--ink);
  font-family: "LXGW WenKai", "KaiTi", "STKaiti", serif; -webkit-user-select: none; user-select: none; touch-action: none; }
#view { position: fixed; left: 0; top: 0; right: 0; bottom: var(--nav-h); }
#view canvas { display: block; width: 100%; height: 100%; cursor: grab; }
#view canvas:active { cursor: grabbing; }
/* 绢纹与暗角 */
#silk { position: fixed; left: 0; top: 0; right: 0; bottom: var(--nav-h); pointer-events: none; mix-blend-mode: multiply; opacity: 0.38; background-size: 128px 128px; }
#vignette { position: fixed; left: 0; top: 0; right: 0; bottom: var(--nav-h); pointer-events: none;
  background: radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 55%, rgba(70,48,22,0.28) 100%); }
/* 右上角竖排标题 */
#title-v { position: fixed; top: 18px; right: 22px; writing-mode: vertical-rl; font-size: 34px; letter-spacing: 10px;
  padding: 18px 10px; background: linear-gradient(#efe3c6, #e2d2ad); border: 1px solid #8a6c48; box-shadow: 0 2px 10px rgba(60,40,20,0.25);
  color: #2a2018; pointer-events: none; }
#title-v .seal { display: inline-block; margin-top: 12px; writing-mode: vertical-rl; font-size: 13px; letter-spacing: 1px; color: #f3e6d0;
  background: var(--seal); padding: 5px 3px; border-radius: 2px; }
#title-v .by { font-size: 14px; letter-spacing: 3px; margin-top: 8px; color: #5a4632; }
/* 左上角段落说明 */
#caption { position: fixed; top: 18px; left: 20px; max-width: min(380px, 62vw); padding: 12px 16px 13px; background: var(--paper);
  border-left: 3px solid #7a5a3a; box-shadow: 0 2px 12px rgba(60,40,20,0.18); pointer-events: none; }
#caption h2 { margin: 0 0 5px; font-size: 24px; letter-spacing: 4px; font-weight: normal; }
#caption p { margin: 0; font-size: 15px; line-height: 1.65; color: #3e3226; }
#caption.show { animation: capIn 0.7s ease; }
@keyframes capIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
/* 操作提示 */
#hint { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 18px); transform: translateX(-50%); padding: 8px 18px; font-size: 15px;
  background: rgba(40,30,20,0.62); color: #f2e8d4; border-radius: 3px; white-space: nowrap; transition: opacity 1.2s ease; pointer-events: none; }
#hint.gone { opacity: 0; }
/* 导航条 */
#nav { position: fixed; left: 0; right: 0; bottom: 0; height: var(--nav-h); background: #3a2c1e url(data:image/jpeg;base64,%%THUMB%%) 0 0 / 100% 100% no-repeat;
  cursor: pointer; border-top: 2px solid #5a4430; touch-action: none; }
#nav::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(30,20,10,0.15), rgba(30,20,10,0.05)); pointer-events: none; }
#nav-box { position: absolute; top: 0; bottom: 0; border: 2px solid #f6ead0; background: rgba(255,245,220,0.18);
  box-shadow: 0 0 0 9999px rgba(30,20,10,0.32); pointer-events: none; z-index: 2; }
#nav-marks { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.nav-sec { position: absolute; top: 0; bottom: 0; border-left: 1px dashed rgba(250,240,220,0.7); }
.nav-sec span { position: absolute; top: 3px; left: 50%; transform: translateX(-50%); font-size: 13px; letter-spacing: 2px; color: #f8eedb;
  background: rgba(50,36,22,0.55); padding: 1px 8px; border-radius: 2px; white-space: nowrap; transition: background 0.4s; }
.nav-sec.cur span { background: rgba(150,50,35,0.85); }
/* 视角面板 */
#panel { position: fixed; right: 16px; bottom: calc(var(--nav-h) + 16px); width: 214px; background: var(--paper); border: 1px solid #8a6c48;
  box-shadow: 0 2px 12px rgba(60,40,20,0.22); font-size: 14px; }
#panel-toggle { display: flex; justify-content: space-between; align-items: center; padding: 7px 12px; cursor: pointer; letter-spacing: 4px; font-size: 16px;
  border-bottom: 1px solid rgba(138,108,72,0.5); }
#panel-toggle i { font-style: normal; transition: transform 0.3s; }
#panel.collapsed #panel-toggle i { transform: rotate(180deg); }
#panel.collapsed #panel-toggle { border-bottom: none; }
#panel.collapsed .body { display: none; }
#panel .body { padding: 8px 12px 12px; }
#panel label { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
#panel label span { width: 34px; flex: none; }
#panel input[type=range] { flex: 1; accent-color: #7a4a30; }
#panel .btns { display: flex; gap: 8px; margin-top: 10px; }
#panel button { flex: 1; font-family: inherit; font-size: 15px; padding: 5px 0; background: #ede0c2; border: 1px solid #8a6c48; color: var(--ink); cursor: pointer; letter-spacing: 3px; }
#panel button.on { background: #8c4632; color: #f6ead6; border-color: #6a3020; }
/* 题签 */
#labels { position: fixed; left: 0; top: 0; right: 0; bottom: var(--nav-h); pointer-events: none; overflow: hidden; }
.label { position: absolute; left: 0; top: 0; writing-mode: vertical-rl; font-size: 14px; letter-spacing: 3px; padding: 7px 3px;
  background: rgba(240,230,206,0.9); border: 1px solid #8a6c48; color: #2a2018; white-space: nowrap; box-shadow: 0 1px 4px rgba(50,30,10,0.25); }
.label.major { font-size: 17px; padding: 9px 4px; border-color: #8c3a28; background: rgba(244,232,206,0.95); }
.label.minor { font-size: 12px; opacity: 0.85; }
/* 加载 */
#loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--silk);
  z-index: 20; transition: opacity 1s ease; font-size: 22px; letter-spacing: 6px; }
#loading .big { font-size: 46px; letter-spacing: 14px; margin-bottom: 14px; }
body.ready #loading { opacity: 0; pointer-events: none; }
@media (max-width: 720px) {
  :root { --nav-h: 54px; }
  #title-v { font-size: 22px; letter-spacing: 6px; padding: 12px 6px; top: 10px; right: 10px; }
  #title-v .by { display: none; }
  #caption { top: 10px; left: 10px; padding: 8px 11px; max-width: 70vw; }
  #caption h2 { font-size: 19px; }
  #caption p { font-size: 13px; }
  #hint { font-size: 12px; white-space: normal; width: 86vw; text-align: center; }
  .nav-sec span { font-size: 11px; padding: 0 4px; letter-spacing: 0; }
  #panel { right: 8px; width: 190px; }
}
</style>
</head>
<body>
<div id="view"></div>
<div id="silk"></div>
<div id="vignette"></div>
<div id="labels"></div>
<div id="caption"><h2 id="cap-title">郊野春色</h2><p id="cap-text"></p></div>
<div id="title-v">清明上河图<span class="by">北宋 张择端</span><span class="seal">三维长卷</span></div>
<div id="hint">左键拖动平移（含前后）　右键或 Shift 拖动转视角、俯仰　滚轮缩放　点选下方长卷跳转</div>
<div id="panel">
  <div id="panel-toggle">视角<i>▾</i></div>
  <div class="body">
    <label><span>缩放</span><input id="s-zoom" type="range" min="0" max="100" step="0.5"></label>
    <label><span>俯仰</span><input id="s-pitch" type="range" min="2" max="86" step="0.5"></label>
    <label><span>旋转</span><input id="s-rot" type="range" min="-180" max="180" step="1"></label>
    <div class="btns"><button id="b-labels" class="on">题签</button><button id="b-reset">复位</button></div>
  </div>
</div>
<div id="nav"><div id="nav-marks"></div><div id="nav-box"></div></div>
<div id="loading"><div class="big">清明上河图</div><div id="loading-msg">展卷中……</div></div>
<script>%%THREE%%</script>
<script>
(function () {
%%APP%%
})();
</script>
</body>
</html>
